*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--on);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{border:none;background:none;color:inherit;font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}

#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 40px)}

.llogo{width:76px;height:76px;border-radius:24px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#04140C;animation:glow 3.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(0,230,118,.4)}50%{box-shadow:0 0 52px rgba(0,230,118,.7)}}
.lbox h1{text-align:center;font-size:25px;font-weight:900;letter-spacing:-.8px;margin-bottom:5px}
.lbox h1 span{color:var(--pri)}
.lsub{text-align:center;color:var(--mute);font-size:13px;margin-bottom:26px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--s3);color:var(--on);font-size:15px;font-family:inherit;outline:none;transition:.16s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:var(--r);font-weight:800;font-size:14px;position:relative;overflow:hidden;transition:transform .12s,opacity .15s}

.btn.zap{background:linear-gradient(135deg,var(--zap),var(--zap2));color:#fff;box-shadow:0 4px 18px rgba(37,211,102,.35)}
.btn.tonal{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.38);color:var(--pri)}
.btn.ghost{border:1px solid var(--line);color:var(--mute)}
.btn[disabled]{opacity:.42;pointer-events:none}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}

.htxt{flex:1;min-width:180px}

.ib:hover{border-color:var(--pri);color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.kpi{border-radius:var(--r);padding:15px;border:1px solid var(--line);background:var(--s2);position:relative;overflow:hidden;cursor:pointer;transition:transform .16s}

.tab{padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:var(--s2);color:var(--mute);font-size:12.5px;font-weight:800;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:7px;transition:.16s}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:linear-gradient(160deg,var(--s2),var(--s3));border:1px solid var(--line);border-radius:var(--rl);padding:26px;box-shadow:var(--e2);animation:pop .26s cubic-bezier(.2,.85,.25,1)}

.hnd{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

@keyframes up{from{transform:translateY(100%)}to{transform:none}}

.panel{background:linear-gradient(155deg,var(--s2),var(--s3));border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}

.panel h4{font-size:14.5px;font-weight:800;margin-bottom:4px}
.panel .psub{font-size:11px;color:var(--dim);margin-bottom:16px}
.bars{display:grid;gap:11px}
.barrow .bl{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:5px}
.barrow .bt{height:7px;border-radius:4px;background:var(--s4);overflow:hidden}

.tpl-chip.on{background:rgba(0,230,118,.14);border-color:var(--pri);color:var(--pri)}
</style>
</head>

const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const avc=n=>{const c=['#00E676','#3B82F6','#A855F7','#06B6D4','#FACC15','#EC4899','#F97316','#84CC16'];let h=0;const s=String(n||'');for(let i=0;i<s.length;i++)h=(h*31+s[i].charCodeAt(0))>>>0;return c[h%c.length]};
const rgba=(h,a)=>{const x=String(h||'#00E676').replace('#','');return`rgba(${parseInt(x.slice(0,2),16)},${parseInt(x.slice(2,4),16)},${parseInt(x.slice(4,6),16)},${a})`};
const fone=v=>{const d=dig(v).slice(0,11);if(!d)return'';if(d.length<=2)return d;if(d.length<=6)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
const ls={get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
function fimValidade(v){if(!v)return null;const p=String(v).slice(0,10).split('-');if(p.length!==3)return null;const d=new Date(+p[0],+p[1]-1,+p[2],23,59,59,999);return isNaN(d.getTime())?null:d.getTime()}
function fData(v){const t=fimValidade(v);return t?new Date(t).toLocaleDateString('pt-BR'):'—'}
function fDT(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function hoje(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDias(base,n){const t=fimValidade(base)||Date.now();const d=new Date(Math.max(t,Date.now()));d.setDate(d.getDate()+n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function sha256(t){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function sb(path,method='GET',body=null){
const o={method,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:method==='POST'?'return=representation':'return=minimal'}};
if(body)o.body=JSON.stringify(body);
const r=await fetch(SB_URL+'/rest/v1/'+path,o);
if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+(t?' · '+t.slice(0,110):''))}
return method==='GET'?r.json():true}

function estado(l){
if(l.status_aprovacao==='Pendente')return'pendente';
if(l.status_aprovacao==='Reprovado')return'reprovada';
if(l.status==='Inativo')return'bloqueada';
const t=fimValidade(l.validade);if(!t)return'semdata';
const now=Date.now();
if(t<=now)return'vencida';
if(t-now<=CFG.alertaDias*864e5)return'vencendo';
return'ativa'}
function diasRest(l){const t=fimValidade(l.validade);return t===null?null:Math.ceil((t-Date.now())/864e5)}

const CAMPOS=['ultimo_acesso','last_seen','ultima_verificacao','heartbeat','last_ping','online_at','ping'];
function tsPresenca(l){for(const c of CAMPOS)if(l[c]){const d=new Date(l[c]);if(!isNaN(d.getTime()))return d.getTime()}
if(l.hwid&&presence[l.hwid]){const p=presence[l.hwid];if(typeof p==='number')return p;const v=p.timestamp||p.lastSeen||p.ts||p.onlineAt;if(v){const d=new Date(v);if(!isNaN(d.getTime()))return d.getTime()}}return null}
function statusOnline(l){const t=tsPresenca(l);if(!t)return{k:'sem',lb:'SEM SINAL',cor:'#6B7280'};
const m=(Date.now()-t)/60000;if(m<=CFG.onlineMin)return{k:'on',lb:'ONLINE',cor:'#00E676'};
if(m<=CFG.ausenteMin)return{k:'away',lb:'AUSENTE',cor:'#FACC15'};return{k:'off',lb:'OFFLINE',cor:'#6B7280'}}
function tempoAtras(t){if(!t)return'nunca';const s=Math.floor((Date.now()-t)/1000);if(s<60)return'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' d'}
async function carregarPresence(){for(const no of['presence','heartbeat','clientes_online']){try{const r=await fetch(FB_URL+'/'+no+'.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&typeof d==='object'){Object.assign(presence,d);return}}}catch{}}}

async function login(){

const err=$('#lErro');err.textContent='';
if(!senha){err.textContent='Informe a senha';return}
const btn=$('#lBtn');btn.disabled=true;btn.textContent='Verificando…';
try{
if(tipo==='admin'){const custom=ls.get(LSK.admin,null);
const ok=custom?(await sha256(senha))===custom:senha===ADMIN_DEFAULT;
if(!ok){err.textContent='Senha incorreta';return}

else{if(!email){err.textContent='Informe o e-mail';return}
const revs=await sb('revendedores?email=eq.'+encodeURIComponent(email)+'&status=eq.Ativo');
if(!revs?.length||revs[0].senha!==senha){err.textContent='Credenciais inválidas ou acesso bloqueado';return}

sessionStorage.setItem(AUTH,JSON.stringify(usuario));await entrar()}
catch(e){err.textContent='Falha: '+e.message}

function fmtCD(ms){if(ms<=0)return{txt:'VENCIDA',cor:'#EF4444'};
const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;
const p=n=>String(n).padStart(2,'0');
if(d>7)return{txt:`${d}d ${p(h)}h`,cor:'#00E676'};
if(d>=1)return{txt:`${d}d ${p(h)}h ${p(m)}m`,cor:d<=3?'#F97316':'#FACC15'};
return{txt:`${p(h)}:${p(m)}:${p(ss)}`,cor:'#EF4444'}}
function tick(){document.querySelectorAll('[data-cd]').forEach(el=>{const ms=+el.dataset.cd-Date.now(),f=fmtCD(ms);
el.textContent=f.txt;el.style.color=f.cor;const box=el.closest('.cd');
if(box&&ms<=0){box.style.background='rgba(239,68,68,.1)';box.style.border='1px solid rgba(239,68,68,.35)'}});

function botoes(l,e){
const B=(a,lb,c,i)=>`<button class="ab" data-act="${a}" data-id="${l.id}" style="border-color:${rgba(c,.4)};background:${rgba(c,.1)};color:${c}">${i} ${lb}</button>`;
if(usuario.tipo==='revendedor')return B('renovar','Renovar','#00E676','🔄')+B('contato','Contato','#3B82F6','📱');
if(e==='pendente')return B('aprovar','Aprovar','#00E676','✅')+B('rejeitar','Rejeitar','#EF4444','❌')+B('detalhes','Ver','#06B6D4','👁')+B('excluir','Excluir','#6B7280','🗑');
if(e==='reprovada')return B('reenviar','Reenviar','#F59E0B','🔄')+B('excluir','Excluir','#6B7280','🗑');
let b='';
if(e==='vencida')b+=B('renovar','Renovar','#00E676','🔄');
else if(e==='bloqueada')b+=B('toggle','Desbloquear','#00E676','✅');
else b+=B('renovar','Renovar','#00E676','🔄')+B('toggle','Bloquear','#EF4444','🚫');
return b+B('editar','Editar','#3B82F6','✏️')+B('excluir','Excluir','#6B7280','🗑')}

document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=b.dataset.act;
if(a==='renovar')sheetRenovar(id);else if(a==='toggle')toggle(id);else if(a==='excluir')excluir(id);
else if(a==='editar')sheetEditar(id);else if(a==='aprovar')aprovar(id);else if(a==='rejeitar')rejeitar(id);
else if(a==='reenviar')reenviar(id);else if(a==='detalhes')detalhes(id);else if(a==='contato')contato(id)});
document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=b.dataset.rev;
if(a==='edit')sheetEditarRev(id);else if(a==='toggle')toggleRev(id);else if(a==='del')excluirRev(id);
else if(a==='ver'){filtroRev=revendedores.find(r=>String(r.id)===String(id))?.codigo||'todos';$('#iRev').value=filtroRev;aba='todas';render()}});
const nr=$('#bNovoRev');if(nr)nr.onclick=novoRev;

function whatsappStatus(id){

if(!l){toast('Licença não encontrada','err');return}
const tel=dig(l.telefone);
if(tel.length<10){toast('Telefone inválido ou não cadastrado','err');return}
const e=estado(l),tpl=MSGS_ZAP[e]||MSGS_ZAP.semdata;

sheet((b,close)=>{
const renderPreview=()=>{

if(prev)prev.textContent=msgAtual;
};

b.insertAdjacentHTML('beforeend',`
<h3 style="color:${tpl.cor}">💬 WhatsApp · ${tpl.titulo}</h3>
<p class="desc">
<strong style="color:var(--on)">${esc(l.nome_cliente)}</strong> · ${esc(l.nome_empresa||'—')}<br>

</p>

<div class="sect" style="color:var(--pri)"><i style="background:var(--pri)"></i>Modelo de mensagem</div>
<div class="tpl-chips">
${Object.entries(MSGS_ZAP).map(([k,v])=>`<button class="tpl-chip${k===e?' on':''}" data-tpl="${k}" style="${k===e?`border-color:${v.cor};color:${v.cor};background:${rgba(v.cor,.14)}`:''}">${v.titulo.split(' ')[0]} ${ESTADOS[k].lb}</button>`).join('')}
</div>

<div class="zap-preview">
<div class="msg">${esc(msgAtual)}</div>
<div class="meta">Mensagem pré-visualização</div>
</div>

<div class="fld"><label>Editar mensagem (opcional)</label>
<textarea class="inp" id="zMsg" rows="7" style="min-height:160px;resize:vertical;line-height:1.55">${esc(msgAtual)}</textarea>

<div class="row">
<button class="btn ghost" id="zNo">Cancelar</button>
<a class="btn zap full" id="zOk" target="_blank" href="#">💬 Abrir WhatsApp</a>

const atualizarLink=()=>{

if(!texto){b.querySelector('#zOk').setAttribute('href','#');b.querySelector('#zOk').classList.add('disabled');return}
const url=`https://wa.me/55${tel}?text=${encodeURIComponent(texto)}`;
b.querySelector('#zOk').setAttribute('href',url);
b.querySelector('#zOk').classList.remove('disabled');
};

b.querySelector('#zMsg').oninput=e=>{msgAtual=e.target.value;renderPreview();atualizarLink()};

const k=x.dataset.tpl,novo=MSGS_ZAP[k];
msgAtual=novo.msg(l);

renderPreview();atualizarLink();
b.querySelectorAll('[data-tpl]').forEach(y=>{y.classList.remove('on');y.style=''});
x.classList.add('on');x.style=`border-color:${novo.cor};color:${novo.cor};background:${rgba(novo.cor,.14)}`;
});

function confirmar(titulo,alvo,texto,cor,fn,digitar){
sheet((b,close)=>{b.insertAdjacentHTML('beforeend',`<h3 style="color:var(--${cor==='red'?'err':'pri'})">${esc(titulo)}</h3>
<p class="desc"><strong style="color:var(--on)">${esc(alvo)}</strong><br>${esc(texto)}</p>

<div class="row"><button class="btn ghost" id="cNo">Cancelar</button><button class="btn ${cor==='red'?'red':'pri'}" id="cYes"${digitar?' disabled':''}>Confirmar</button></div>`);
b.querySelector('#cNo').onclick=close;const y=b.querySelector('#cYes');
if(digitar)b.querySelector('#cDig').oninput=e=>y.disabled=e.target.value.trim().toUpperCase()!==digitar;
y.onclick=async()=>{y.disabled=true;y.textContent='Processando…';await fn();close()}})}

function sheetRenovar(id){
const l=licencas.find(x=>String(x.id)===String(id));if(!l)return;
const e=estado(l),dr=diasRest(l);
sheet((b,close)=>{b.insertAdjacentHTML('beforeend',`<h3>🔄 Renovar licença</h3>
<p class="desc"><strong style="color:var(--on)">${esc(l.nome_cliente)}</strong> · ${esc(l.nome_empresa||'sem empresa')}<br>
Validade atual: <strong>${fData(l.validade)}</strong> · <strong style="color:${ESTADOS[e].cor}">${ESTADOS[e].lb}</strong>${dr!==null&&dr<0?` (vencida há ${Math.abs(dr)} dias)`:''}</p>
<div class="sect" style="color:var(--pri)"><i style="background:var(--pri)"></i>Renovação rápida</div>
<div class="row" style="margin-bottom:14px">${[30,90,180,365].map(d=>`<button class="btn tonal" data-add="${d}">+${d} dias</button>`).join('')}</div>
<div class="fld"><label>Ou escolha a data exata</label><input class="inp" type="date" id="rData" value="${l.validade?String(l.validade).slice(0,10):hoje()}"></div>
<div id="rPrev" style="padding:12px 14px;border-radius:12px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.3);margin-bottom:16px;font-size:12.5px;color:var(--mute)"></div>
<label style="display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;background:var(--s3);border:1px solid var(--line);margin-bottom:18px;cursor:pointer">
<input type="checkbox" id="rReat" checked style="width:20px;height:20px;accent-color:#00E676">
<span style="font-size:12.5px;font-weight:700">Reativar acesso (status Ativo + aprovação OK)</span></label>
<div class="row"><button class="btn ghost" id="rNo">Cancelar</button><button class="btn pri" id="rOk">✅ Confirmar renovação</button></div>`);
const inp=b.querySelector('#rData'),prev=b.querySelector('#rPrev');
const upd=()=>{const t=fimValidade(inp.value);if(!t){prev.innerHTML='Data inválida';return}
const d=Math.ceil((t-Date.now())/864e5);
prev.innerHTML=`Nova validade: <strong style="color:var(--pri)">${fData(inp.value)}</strong> · ${d>0?`<strong style="color:var(--pri)">${d} dias</strong> de acesso`:'<strong style="color:var(--err)">já vencida</strong>'}`};
inp.oninput=upd;upd();
b.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{inp.value=addDias(l.validade,+x.dataset.add);upd()});
b.querySelector('#rNo').onclick=close;
b.querySelector('#rOk').onclick=async()=>{
const nova=inp.value;if(!fimValidade(nova)){toast('Data inválida','err');return}
const btn=b.querySelector('#rOk');btn.disabled=true;btn.textContent='Salvando…';
try{const p={validade:nova};
if(b.querySelector('#rReat').checked){p.status='Ativo';if(l.status_aprovacao!=='Aprovado')p.status_aprovacao='Aprovado'}
await sb('licencas?id=eq.'+id,'PATCH',p);
addHist(id,'renovacao',l.validade,nova);logar('Renovou',l.nome_cliente,`${fData(l.validade)} → ${fData(nova)}`);
toast('Renovada até '+fData(nova));close();await carregar(false)}
catch(err){toast('Erro: '+err.message,'err');btn.disabled=false;btn.textContent='✅ Confirmar renovação'}}})}

async function toggle(id){
const l=licencas.find(x=>String(x.id)===String(id));if(!l)return;const bloq=l.status==='Ativo';
confirmar(bloq?'🚫 Bloquear acesso':'✅ Desbloquear acesso',l.nome_cliente||'—',
bloq?'O cliente perde o acesso na próxima verificação.':'O cliente volta a ter acesso imediatamente.',bloq?'red':'pri',async()=>{
try{await sb('licencas?id=eq.'+id,'PATCH',{status:bloq?'Inativo':'Ativo'});
addHist(id,bloq?'bloqueio':'desbloqueio',l.status,bloq?'Inativo':'Ativo');
logar(bloq?'Bloqueou':'Desbloqueou',l.nome_cliente);
toast(bloq?'Acesso bloqueado':'Acesso liberado',bloq?'warn':'ok');await carregar(false)}
catch(e){toast('Erro: '+e.message,'err')}})}

function viewStats(g){
const total=licencas.length,online=g.online.length;
const direto=licencas.filter(l=>!l.codigo_revendedor||l.codigo_revendedor==='DIRETO').length;
const saud=g.ativa.length+g.vencendo.length,taxa=total?Math.round(saud/total*100):0;
const prox=licencas.filter(l=>{const d=diasRest(l);return d!==null&&d>0&&d<=30}).sort((a,b)=>diasRest(a)-diasRest(b));
const dist=[['ativa',g.ativa.length],['vencendo',g.vencendo.length],['vencida',g.vencida.length],['bloqueada',g.bloqueada.length],['pendente',g.pendente.length],['reprovada',g.reprovada.length]];
const maxD=Math.max(1,...dist.map(d=>d[1]));
const meses={};licencas.forEach(l=>{const t=fimValidade(l.validade);if(!t)return;const d=new Date(t),k=`${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;meses[k]=(meses[k]||0)+1});
const mk=Object.keys(meses).sort((a,b)=>(a.slice(3)+a.slice(0,2))-(b.slice(3)+b.slice(0,2))).slice(0,8);
const maxM=Math.max(1,...mk.map(k=>meses[k]));
const rank=revendedores.map(r=>{const m=licencas.filter(l=>l.codigo_revendedor===r.codigo);return{nome:r.nome,total:m.length,at:m.filter(l=>['ativa','vencendo'].includes(estado(l))).length}}).sort((a,b)=>b.total-a.total);
const maxR=Math.max(1,...rank.map(r=>r.total));
return`<div class="kpis" style="margin-bottom:18px">
${[['Total de licenças',total,'#06B6D4'],['Saúde da base',taxa+'%',taxa>=70?'#00E676':taxa>=40?'#FACC15':'#EF4444'],['Clientes diretos',direto,'#3B82F6'],['Via revenda',total-direto,'#F59E0B'],['Online agora',online,'#00E676'],['Renovações em 30d',prox.length,'#A855F7']].map(([l,v,c])=>`<div class="kpi" style="background:linear-gradient(150deg,${rgba(c,.12)},var(--s2));border-color:${rgba(c,.3)}"><div class="gl" style="background:radial-gradient(circle,${rgba(c,.22)},transparent 70%)"></div><div class="lb">${l}</div><div class="vl" style="color:${c}">${v}</div></div>`).join('')}</div>
<div class="panels">
<div class="panel"><div class="top" style="background:linear-gradient(90deg,var(--pri),transparent)"></div><h4>Distribuição por estado</h4><p class="psub">Situação real de cada licença</p>
<div class="bars">${dist.map(([k,n])=>{const E=ESTADOS[k];return`<div class="barrow"><div class="bl"><span style="color:${E.cor};font-weight:700">${E.ic} ${E.lb}</span><span style="font-weight:800">${n}</span></div><div class="bt"><div class="bf" style="width:${n/maxD*100}%;background:linear-gradient(90deg,${E.cor},${rgba(E.cor,.4)});box-shadow:0 0 10px ${rgba(E.cor,.5)}"></div></div></div>`}).join('')}</div></div>
<div class="panel"><div class="top" style="background:linear-gradient(90deg,var(--gold),transparent)"></div><h4>Vencimentos por mês</h4><p class="psub">Projeção de renovações</p>
${mk.length?`<div class="bars">${mk.map(k=>`<div class="barrow"><div class="bl"><span style="font-weight:700">${k}</span><span style="font-weight:800;color:var(--gold)">${meses[k]}</span></div><div class="bt"><div class="bf" style="width:${meses[k]/maxM*100}%;background:linear-gradient(90deg,var(--gold),${rgba('#F59E0B',.4)})"></div></div></div>`).join('')}</div>`:'<p style="color:var(--dim);font-size:12.5px">Sem validades registradas</p>'}</div>
<div class="panel"><div class="top" style="background:linear-gradient(90deg,var(--ter),transparent)"></div><h4>Ranking de revendedores</h4><p class="psub">Por número de clientes</p>
${rank.length?`<div class="bars">${rank.map((r,i)=>`<div class="barrow"><div class="bl"><span style="font-weight:700">${i<3?['🥇','🥈','🥉'][i]:''} ${esc(r.nome)}</span><span style="font-weight:800;color:var(--ter)">${r.total} <span style="color:var(--dim);font-weight:600">(${r.at} ativas)</span></span></div><div class="bt"><div class="bf" style="width:${r.total/maxR*100}%;background:linear-gradient(90deg,var(--ter),${rgba('#A855F7',.4)})"></div></div></div>`).join('')}</div>`:'<p style="color:var(--dim);font-size:12.5px">Nenhum revendedor</p>'}</div>
<div class="panel"><div class="top" style="background:linear-gradient(90deg,var(--warn),transparent)"></div><h4>⚠️ Próximas renovações</h4><p class="psub">Vencem nos próximos 30 dias</p>
${prox.length?`<div style="max-height:280px;overflow-y:auto">${prox.map(l=>{const d=diasRest(l),c=d<=3?'#EF4444':d<=7?'#F97316':'#FACC15';return`<div class="li"><span class="k">${esc(l.nome_cliente||'—')}<br><span style="font-weight:600;opacity:.7">${esc(l.nome_empresa||'')}</span></span><span class="v" style="color:${c}">${d} dia(s)<br><span style="font-size:10px;color:var(--dim)">${fData(l.validade)}</span></span></div>`}).join('')}</div>`:'<p style="color:var(--dim);font-size:12.5px">Nenhuma renovação próxima 🎉</p>'}</div>
</div>`}

const head=['Cliente','Empresa','Email','Telefone','CNPJ','Cidade','Responsavel','HWID','Validade','Dias restantes','Estado','Status','Aprovacao','Online','Ultimo sinal','Revendedor','Codigo revendedor','Aprovado por','Data aprovacao'];
const rows=lista.map(l=>{const on=statusOnline(l),d=diasRest(l);
