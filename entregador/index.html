<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070B0F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="App do entregador OS-PREMIUM: receba pedidos, navegue e confirme entregas com GPS ao vivo." />
<title>Entregador — OS-PREMIUM</title>
<style>
  :root{
    --bg:#070B0F; --card:#0F1720; --card2:#121D28; --line:rgba(255,255,255,.07);
    --txt:#E6EDF3; --mut:#8B98A5; --green:#00E676; --gold:#F59E0B; --red:#EF4444; --blue:#3B82F6;
    --r:20px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(1100px 520px at 50% -12%,rgba(0,230,118,.10),transparent 62%),
      var(--bg);
    color:var(--txt);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 14px calc(30px + var(--safe-b));
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:70px}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;padding-top:env(safe-area-inset-top,0px);background:rgba(7,11,15,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#00E676,#00B25A);display:grid;place-items:center;font-size:17px;flex-shrink:0;box-shadow:0 6px 16px rgba(0,230,118,.28)}
  .brand b{font-size:14px;white-space:nowrap}
  .brand .sub{font:700 10px/1 var(--mono);color:var(--mut);letter-spacing:1px}
  .gps{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);flex-shrink:0}
  .gps.on{color:var(--green)}
  .gps i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .gps.on i{box-shadow:0 0 0 0 rgba(0,230,118,.6);animation:live 1.6s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(0,230,118,.55)}70%{box-shadow:0 0 0 8px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}
  .pill i{width:8px;height:8px;border-radius:50%;background:currentColor;font-style:normal;animation:live 1.8s infinite}
  .num{font:800 clamp(26px,7vw,34px)/1.15 var(--mono);margin:8px 0 10px}
  .lbl{font:700 11px/1 var(--mono);color:var(--mut);letter-spacing:1.6px;text-transform:uppercase}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
  .row:last-child{border:0}
  .row .k{color:var(--mut);flex-shrink:0}
  .row .v{font-weight:600;text-align:right;word-break:break-word}
  .addr{font-size:16px;font-weight:700;line-height:1.5;margin:6px 0 2px}
  .obs{margin-top:10px;padding:12px;background:rgba(245,158,11,.08);border:1px dashed rgba(245,158,11,.35);border-radius:12px;font-size:13px;color:#EBD9B4;line-height:1.6}
  .actions{display:grid;gap:10px}
  .btn{min-height:54px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;padding:0 18px;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,#00E676,#00B25A);border-color:transparent;color:#04140B;box-shadow:0 8px 20px rgba(0,230,118,.25)}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(59,130,246,.25)}
  .btn.gold{background:linear-gradient(135deg,#F59E0B,#D97706);border-color:transparent;color:#000;box-shadow:0 8px 20px rgba(245,158,11,.25)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gpsbox{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.25)}
  .gpsbox .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,230,118,.6);animation:live 1.6s infinite;flex-shrink:0}
  .gpsbox.off{background:rgba(255,255,255,.03);border-color:var(--line)}
  .gpsbox.off .dot{background:var(--mut);animation:none}
  .gpsbox .t{font-size:12px;color:var(--mut);line-height:1.5}
  .gpsbox .t b{color:var(--txt);display:block;font-size:13px}
  .state{text-align:center;padding:34px 12px}
  .state .big{font-size:46px;margin-bottom:12px}
  .state b{font-size:17px}
  .state p{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.6}
  .foot{text-align:center;font-size:11px;color:var(--mut);line-height:1.8;padding-top:4px}
  .foot b{color:var(--green)}
  .skel{height:14px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.13),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.15s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));z-index:120;background:rgba(0,230,118,.95);color:#04140B;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;box-shadow:0 12px 32px rgba(0,230,118,.35);opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #toast.err{background:rgba(239,68,68,.95);color:#fff}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">🛵</div>
    <div style="min-width:0">
      <b>OS-PREMIUM <span style="color:var(--green)">Entregador</span></b>
      <div class="sub" id="topref">CARREGANDO...</div>
    </div>
  </div>
  <span class="gps" id="gpsBadge"><i></i><span id="gpsTxt">GPS OFF</span></span>
</div>

<div class="wrap">
  <div class="card" id="content">
    <div class="skel" style="width:38%"></div>
    <div class="skel" style="width:62%;height:26px"></div>
    <div class="skel" style="width:80%"></div>
  </div>
  <div class="foot"><b>OS-PREMIUM</b> • Tecnologia que gera resultados<br/>Dica: adicione esta página à tela inicial para usar como app.</div>
</div>

<div id="toast"></div>

<script>
  const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
  const token = new URLSearchParams(location.search).get('t');
  const el = () => document.getElementById('content');
  let lastJson = '';
  let entrega = null;
  let watchId = null;
  let ultimoEnvioGPS = 0;

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const moeda = v => (parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  const STATUS = {
    aguardando: { txt:'⏳ Aguardando você aceitar', cor:'#FACC15', bg:'rgba(250,204,21,.14)' },
    aceita:     { txt:'👍 Aceita — pronta para rota', cor:'#3B82F6', bg:'rgba(59,130,246,.14)' },
    em_rota:    { txt:'🛵 Em rota — GPS transmitindo', cor:'#00E676', bg:'rgba(0,230,118,.14)' },
    entregue:   { txt:'✅ Entrega concluída', cor:'#9CA3AF', bg:'rgba(156,163,175,.14)' },
    cancelada:  { txt:'❌ Entrega cancelada pela loja', cor:'#EF4444', bg:'rgba(239,68,68,.14)' },
  };

  const toast = (msg, err) => {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = err ? 'show err' : 'show';
    setTimeout(() => { t.className = ''; }, 2600);
  };

  async function carregar(){
    if(!token){ el().innerHTML = '<div class="state"><div class="big">🔗</div><b>Link inválido</b><p>Solicite à loja um novo link de entrega.</p></div>'; return; }
    try{
      const r = await fetch(FB + '/entregas/' + encodeURIComponent(token) + '.json');
      const d = await r.json();
      const json = JSON.stringify(d);
      if(json === lastJson) return;
      lastJson = json;
      entrega = d;
      render();
    }catch(e){
      el().innerHTML = '<div class="state"><div class="big">⚠️</div><b>Sem conexão</b><p>Verifique sua internet e tente novamente.</p></div>';
    }
  }

  function render(){
    const top = document.getElementById('topref');
    if(!entrega){
      el().innerHTML = '<div class="state"><div class="big">📭</div><b>Nenhuma entrega neste link</b><p>A loja ainda não enviou este pedido ou ele já foi removido.</p></div>';
      top.textContent = 'SEM PEDIDO';
      return;
    }
    top.textContent = 'OS #' + entrega.numero + ' • ' + String(entrega.status||'').toUpperCase();

    // Retoma o GPS sozinho se a página for reaberta durante a rota
    if(entrega.status === 'em_rota' && watchId === null) iniciarGPS(true);

    const st = STATUS[entrega.status] || STATUS.aguardando;
    const tel = String(entrega.telefone||'').replace(/\D/g,'');
    const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(entrega.endereco || entrega.cliente || '');

    let acao = '';
    if(entrega.status === 'aguardando'){
      acao = '<button class="btn primary" onclick="aceitar()">✅ Aceitar entrega</button>';
    } else if(entrega.status === 'aceita'){
      acao = '<button class="btn blue" onclick="iniciarRota()">🛵 Iniciar rota (liga o GPS)</button>';
    } else if(entrega.status === 'em_rota'){
      acao = '<button class="btn gold" onclick="confirmarEntrega()">📦 Confirmar entrega ao cliente</button>';
    } else if(entrega.status === 'entregue'){
      acao = '<div class="state" style="padding:10px 0 0"><div class="big">🎉</div><b>Entrega concluída!</b><p>Você pode fechar esta página.</p></div>';
    } else if(entrega.status === 'cancelada'){
      acao = '<div class="state" style="padding:10px 0 0"><div class="big">❌</div><b>Entrega cancelada pela loja</b><p>Aguarde novas instruções.</p></div>';
    }

    el().innerHTML = `
      <div class="card" style="padding:0;border:0;background:none;box-shadow:none">
        <span class="pill" style="color:${st.cor};background:${st.bg}"><i></i>${st.txt}</span>
        <div class="num">OS #${esc(entrega.numero)}</div>
        <div class="lbl">Cliente</div>
        <div class="addr">👤 ${esc(entrega.cliente)||'—'}</div>
        ${entrega.endereco ? '<div class="lbl" style="margin-top:10px">Endereço de entrega</div><div class="addr">📍 ' + esc(entrega.endereco) + '</div>' : '<p style="margin-top:8px;font-size:12px;color:var(--mut)">Sem endereço cadastrado — combine por telefone.</p>'}
        ${entrega.observacoes ? '<div class="obs">📝 ' + esc(entrega.observacoes) + '</div>' : ''}
        <div style="margin-top:14px">
          <div class="row"><span class="k">Valor a receber</span><span class="v" style="color:var(--green)">R$ ${moeda(entrega.valor)}</span></div>
          <div class="row"><span class="k">Telefone</span><span class="v">${esc(entrega.telefone)||'—'}</span></div>
        </div>
      </div>

      <div class="actions">
        ${tel ? '<div class="grid2"><a class="btn" href="tel:' + tel + '">📞 Ligar</a><a class="btn" target="_blank" href="' + maps + '">🗺️ Como chegar</a></div>' : '<a class="btn" target="_blank" href="' + maps + '">🗺️ Como chegar</a>'}
        ${acao}
      </div>

      <div class="gpsbox ${watchId!==null?'':'off'}" id="gpsBox">
        <div class="dot"></div>
        <div class="t" id="gpsInfo">
          <b>${watchId!==null ? 'GPS transmitindo ao vivo' : 'GPS desligado'}</b>
          ${watchId!==null ? 'A loja e o cliente veem sua posição no mapa.' : 'Ele liga automaticamente ao iniciar a rota.'}
        </div>
      </div>
    `;
  }

  async function patch(body){
    const r = await fetch(FB + '/entregas/' + encodeURIComponent(token) + '.json', {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    return r.ok;
  }

  async function aceitar(){
    toast('✅ Entrega aceita!');
    await patch({ status:'aceita', aceitaEm:new Date().toISOString(), atualizadoEm:new Date().toISOString() });
  }

  async function iniciarRota(){
    if(!('geolocation' in navigator)){ toast('❌ Este aparelho não tem GPS', true); return; }
    iniciarGPS(false);
    toast('🛵 Rota iniciada! GPS ligado.');
    await patch({ status:'em_rota', rotaIniciadaEm:new Date().toISOString(), atualizadoEm:new Date().toISOString() });
  }

  async function confirmarEntrega(){
    if(!confirm('Confirmar que o cliente recebeu o pedido?')) return;
    pararGPS();
    toast('📦 Entrega confirmada!');
    await patch({ status:'entregue', entregueEm:new Date().toISOString(), atualizadoEm:new Date().toISOString() });
  }

  function iniciarGPS(silencioso){
    if(watchId !== null) return;
    watchId = navigator.geolocation.watchPosition(pos => {
      const { latitude, longitude, accuracy, speed } = pos.coords;
      const agora = Date.now();
      if(agora - ultimoEnvioGPS < 5000) return;
      ultimoEnvioGPS = agora;
      fetch(FB + '/posicoes/' + encodeURIComponent(token) + '.json', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ lat:latitude, lng:longitude, precisao:Math.round(accuracy||0), velocidade:Math.round((speed||0)*3.6), timestamp:new Date().toISOString() })
      }).catch(()=>{});
      const badge = document.getElementById('gpsBadge');
      const txt = document.getElementById('gpsTxt');
      if(badge) badge.className = 'gps on';
      if(txt) txt.textContent = 'GPS ON';
      const box = document.getElementById('gpsBox');
      if(box) box.className = 'gpsbox';
      const info = document.getElementById('gpsInfo');
      if(info) info.innerHTML = '<b>GPS transmitindo ao vivo</b>Precisão: ' + Math.round(accuracy||0) + ' m • ' + new Date().toLocaleTimeString('pt-BR');
    }, err => {
      if(!silencioso) toast('❌ GPS negado: ' + err.message, true);
      const txt = document.getElementById('gpsTxt');
      if(txt) txt.textContent = 'GPS OFF';
    }, { enableHighAccuracy:true, maximumAge:3000, timeout:15000 });
  }

  function pararGPS(){
    if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  }

  carregar();
  setInterval(carregar, 5000);
</script>
</body>
</html>
