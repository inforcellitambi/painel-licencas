<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#00E676" />
<title>Entregador — OS-PREMIUM</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070B0F;color:#E6EDF3;font-family:-apple-system,sans-serif;padding:14px;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto}
  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(7,11,15,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07);z-index:50}
  .brand b{font-size:14px}
  .brand span{color:#00E676}
  .gps{font-size:10px;font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(239,68,68,.1);color:#EF4444;border:1px solid rgba(239,68,68,.3)}
  .gps.on{background:rgba(0,230,118,.1);color:#00E676;border-color:rgba(0,230,118,.3)}
  .card{background:#0F1720;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:18px;margin-bottom:12px}
  .pill{display:inline-block;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:10px}
  .lbl{font-size:11px;color:#8B98A5;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;font-weight:700}
  .addr{font-size:16px;font-weight:700;line-height:1.5}
  .btn{min-height:50px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;width:100%;margin-bottom:8px;color:#fff}
  .btn:active{transform:scale(.98)}
  .btn.green{background:linear-gradient(135deg,#00E676,#00B25A);color:#000}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB)}
  .btn.gold{background:linear-gradient(135deg,#F59E0B,#D97706);color:#000}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626)}
  .btn.purple{background:linear-gradient(135deg,#A855F7,#7C3AED)}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.1);color:#E6EDF3}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .login{max-width:420px;margin:60px auto}
  .login h2{text-align:center;margin-bottom:20px}
  .login label{display:block;font-size:11px;color:#8B98A5;text-transform:uppercase;margin:14px 0 6px}
  .login input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:#E6EDF3;font-size:15px;outline:none}
  .login input:focus{border-color:#00E676}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00E676;color:#000;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:999}
  #toast.show{opacity:1}
  #toast.err{background:#EF4444;color:#fff}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
  <div class="brand"><b>OS-PREMIUM <span>Entregador</span></b></div>
  <div class="gps" id="gpsBadge">GPS OFF</div>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
const KEY = 'os_entregador_sessao';

let sessao = null;
let entregas = [];
let watchId = null;
let posicaoAtual = null;

const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return'h'+h.toString(36);}

const toast = (msg,err) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  setTimeout(() => t.className = '', 3000);
};

async function api(path, method, body){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  return await fetch(FB + path, opts);
}

async function login(user, pass){
  const r = await api('/entregadores.json','GET');
  const d = await r.json();
  if(!d) return {ok:false, erro:'Nenhum entregador.'};
  const lista = Object.entries(d).map(([id,v])=>({id,...v}));
  const ent = lista.find(e => e.login && e.login.toLowerCase() === user.toLowerCase());
  if(!ent) return {ok:false, erro:'Login não encontrado.'};
  if(!ent.ativo) return {ok:false, erro:'Conta desativada.'};
  if(ent.senhaHash !== hash(pass)) return {ok:false, erro:'Senha incorreta.'};
  return {ok:true, ent};
}

function salvarSessao(ent){
  sessao = {id:ent.id, nome:ent.nome};
  localStorage.setItem(KEY, JSON.stringify(sessao));
}

function carregarSessao(){
  try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}
}

async function carregarEntregas(){
  if(!sessao) return;
  const r = await api('/entregas.json','GET');
  const d = await r.json();
  if(!d){entregas=[];render();return;}
  const lista = Object.entries(d).map(([token,v])=>({token,...v}));
  // FILTRO: só entregas ativas deste entregador
  entregas = lista.filter(e => 
    e.entregadorId === sessao.id && 
    !['entregue','cancelada','recusada'].includes(e.status)
  );
  render();
}

function renderLogin(erro){
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="login">
      <h2>OS-PREMIUM <span style="color:#00E676">Entregador</span></h2>
      <label>Login</label>
      <input id="inpUser" type="text" placeholder="ex: adriana" />
      <label>Senha</label>
      <input id="inpPass" type="password" placeholder="••••" />
      ${erro ? '<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.12);border-radius:10px;font-size:12px;color:#FCA5A5;text-align:center">'+esc(erro)+'</div>' : ''}
      <button class="btn green" id="btnEntrar" style="margin-top:22px">Entrar</button>
    </div>
  `;
  document.getElementById('btnEntrar').onclick = async () => {
    const user = document.getElementById('inpUser').value.trim();
    const pass = document.getElementById('inpPass').value;
    if(!user || !pass){toast('Preencha tudo',true);return;}
    const res = await login(user, pass);
    if(res.ok){
      salvarSessao(res.ent);
      toast('✅ Bem-vindo, '+res.ent.nome);
      document.getElementById('topbar').style.display = 'flex';
      carregarEntregas();
      setInterval(carregarEntregas, 10000);
    } else {
      renderLogin(res.erro);
    }
  };
}

function render(){
  const app = document.getElementById('app');
  
  if(!sessao){
    renderLogin();
    return;
  }
  
  let html = '<div class="wrap">';
  
  if(entregas.length === 0){
    html += '<div class="card" style="text-align:center;padding:40px"><b>Olá, '+esc(sessao.nome)+'!</b><p style="margin-top:8px;color:#8B98A5">Nenhuma entrega ativa.</p></div>';
  } else {
    entregas.forEach(e => {
      const statusColors = {
        aguardando: {txt:'⏳ Aguardando', cor:'#FACC15', bg:'rgba(250,204,21,.14)'},
        aceita: {txt:'👍 Aceita', cor:'#3B82F6', bg:'rgba(59,130,246,.14)'},
        em_rota: {txt:'🛵 Em rota', cor:'#00E676', bg:'rgba(0,230,118,.14)'}
      };
      const st = statusColors[e.status] || statusColors.aguardando;
      
      let botoes = '';
      if(e.status === 'aguardando'){
        botoes = `
          <button class="btn green" onclick="aceitar('${e.token}')">✅ Aceitar entrega</button>
          <button class="btn red" onclick="recusar('${e.token}')">🚫 Recusar</button>
        `;
      } else if(e.status === 'aceita'){
        botoes = `<button class="btn blue" onclick="iniciarRota('${e.token}')">🛵 Iniciar rota</button>`;
      } else if(e.status === 'em_rota'){
        botoes = `<button class="btn gold" onclick="confirmar('${e.token}')">📦 Confirmar entrega</button>`;
      }
      
      const itens = Array.isArray(e.itens) && e.itens.length > 0
        ? '<div class="lbl">📦 Itens ('+e.itens.length+')</div>' + e.itens.map(it=>'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.05)"><span>'+(it.tipo==='servico'?'🔧 ':'📦 ')+esc(it.nome)+'</span><span style="color:#00E676;font-weight:700">x'+it.quantidade+'</span></div>').join('')
        : '';
      
      html += `
        <div class="card">
          <div class="pill" style="color:${st.cor};background:${st.bg}">${st.txt}</div>
          <div style="font:800 18px/1 ui-monospace,monospace;margin-bottom:10px">OS #${esc(e.numero)}</div>
          <div class="lbl">Cliente</div>
          <div class="addr">👤 ${esc(e.cliente)}</div>
          ${e.endereco ? '<div class="lbl">Endereço</div><div class="addr">📍 '+esc(e.endereco)+'</div>' : ''}
          ${itens}
          ${e.observacoes ? '<div style="margin-top:10px;padding:10px;background:rgba(245,158,11,.08);border-radius:8px;font-size:13px">📝 '+esc(e.observacoes)+'</div>' : ''}
          <div style="margin-top:10px">
            <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px"><span style="color:#8B98A5">Valor</span><span style="color:#00E676;font-weight:700">R$ ${(parseFloat(e.valor)||0).toFixed(2)}</span></div>
          </div>
          <div style="margin-top:14px">${botoes}`;
      
      if(e.endereco){
        const tel = String(e.telefone||'').replace(/\D/g,'');
        const encoded = encodeURIComponent(e.endereco);
        html += '<div class="grid2" style="margin-top:8px">';
        if(tel) html += '<a class="btn ghost" href="tel:'+tel+'" style="text-decoration:none;display:flex;align-items:center;justify-content:center"> Ligar</a>';
        html += '<button class="btn purple" onclick="navegar(\''+encoded+'\')">🗺️ Navegar</button>';
        html += '</div>';
      }
      
      html += '</div></div>';
    });
  }
  
  html += '<button class="btn red" onclick="sair()" style="margin-top:20px">🚪 Sair</button>';
  html += '</div>';
  
  app.innerHTML = html;
}

window.aceitar = async (token) => {
  toast('⏳ Ativando GPS...');
  const ok = await ativarGPS();
  if(!ok){toast('❌ GPS não ativou',true);return;}
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'aceita',aceitaEm:new Date().toISOString()});
  toast('✅ Entrega aceita!');
  setTimeout(carregarEntregas, 500);
};

window.recusar = async (token) => {
  if(!confirm('Recusar esta entrega?')) return;
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'recusada',recusadaEm:new Date().toISOString()});
  toast('🚫 Entrega recusada');
  setTimeout(carregarEntregas, 500);
};

window.iniciarRota = async (token) => {
  if(!posicaoAtual){toast('⚠️ GPS não ativo',true);return;}
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'em_rota',rotaIniciadaEm:new Date().toISOString()});
  toast('🛵 Rota iniciada!');
  setTimeout(carregarEntregas, 500);
};

window.confirmar = async (token) => {
  if(!confirm('Confirmar entrega?')) return;
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'entregue',entregueEm:new Date().toISOString()});
  pararGPS();
  toast('📦 Entrega confirmada!');
  setTimeout(carregarEntregas, 500);
};

window.navegar = (endereco) => {
  const apps = [
    {name:'Waze', url:'https://waze.com/ul?q='+endereco+'&navigate=yes', color:'#33CCFF'},
    {name:'Google Maps', url:'https://www.google.com/maps/search/?api=1&query='+endereco, color:'#4285F4'}
  ];
  const app = document.getElementById('app');
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99990;padding:20px';
  modal.innerHTML = '<div style="background:#0F1720;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:24px;width:100%;max-width:400px"><h3 style="margin:0 0 16px;font-size:18px;color:#3B82F6">🗺️ Escolha o app</h3>' + 
    apps.map(a => '<button class="btn" style="background:'+a.color+';margin-bottom:10px;color:'+(a.name==='Waze'?'#000':'#fff')+'" onclick="window.open(\''+a.url+'\',\'_blank\');this.parentElement.parentElement.remove()">'+a.name+'</button>').join('') +
    '<button class="btn ghost" onclick="this.parentElement.parentElement.remove()">Cancelar</button></div>';
  app.appendChild(modal);
  modal.onclick = (e) => {if(e.target===modal)modal.remove();};
};

window.sair = () => {
  if(confirm('Sair da conta?')){
    sessao = null;
    localStorage.removeItem(KEY);
    pararGPS();
    renderLogin();
  }
};

async function ativarGPS(){
  if(!('geolocation' in navigator)){
    toast('❌ Navegador não suporta GPS',true);
    return false;
  }
  
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        posicaoAtual = {lat:pos.coords.latitude, lng:pos.coords.longitude};
        const badge = document.getElementById('gpsBadge');
        if(badge){badge.className='gps on';badge.textContent='GPS ON';}
        
        watchId = navigator.geolocation.watchPosition(
          (p) => {
            posicaoAtual = {lat:p.coords.latitude, lng:p.coords.longitude};
            transmitirPosicao(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.coords.speed);
          },
          (err) => console.error('GPS erro:', err),
          {enableHighAccuracy:true, timeout:15000, maximumAge:3000}
        );
        
        resolve(true);
      },
      (err) => {
        console.error('GPS falhou:', err);
        let msg = 'Erro no GPS';
        if(err.code===1) msg='Permissão negada';
        if(err.code===2) msg='Localização indisponível';
        if(err.code===3) msg='Timeout';
        toast('❌ '+msg, true);
        resolve(false);
      },
      {enableHighAccuracy:true, timeout:20000, maximumAge:0}
    );
  });
}

function transmitirPosicao(lat, lng, acc, speed){
  entregas.forEach(e => {
    if(e.status === 'aceita' || e.status === 'em_rota'){
      api('/posicoes/'+encodeURIComponent(e.token)+'.json','PUT',{
        lat, lng, precisao:Math.round(acc||0), velocidade:Math.round((speed||0)*3.6),
        timestamp:new Date().toISOString(), entregadorId:sessao.id
      }).catch(()=>{});
    }
  });
}

function pararGPS(){
  if(watchId !== null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  posicaoAtual = null;
  const badge = document.getElementById('gpsBadge');
  if(badge){badge.className='gps';badge.textContent='GPS OFF';}
}

// INIT
const s = carregarSessao();
if(s){
  sessao = s;
  document.getElementById('topbar').style.display = 'flex';
  carregarEntregas();
  setInterval(carregarEntregas, 10000);
} else {
  renderLogin();
}
</script>
</body>
</html>
