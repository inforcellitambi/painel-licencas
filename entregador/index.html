<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00E676" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="OS Entregador" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Entregador — OS-PREMIUM</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300E676'/><path d='M20 62 L32 62 L40 44 L60 44 L68 62 L82 62' stroke='%23070B0F' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='33' cy='67' r='8' fill='%23070B0F'/><circle cx='67' cy='67' r='8' fill='%23070B0F'/><rect x='44' y='30' width='12' height='12' rx='3' fill='%23070B0F'/></svg>" />
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300E676'/><path d='M20 62 L32 62 L40 44 L60 44 L68 62 L82 62' stroke='%23070B0F' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='33' cy='67' r='8' fill='%23070B0F'/><circle cx='67' cy='67' r='8' fill='%23070B0F'/><rect x='44' y='30' width='12' height='12' rx='3' fill='%23070B0F'/></svg>" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{ --bg:#070B0F; --card:#0F1720; --card2:#121D28; --line:rgba(255,255,255,.07); --txt:#E6EDF3; --mut:#8B98A5; --green:#00E676; --gold:#F59E0B; --red:#EF4444; --blue:#3B82F6; --r:20px; --mono:ui-monospace,SFMono-Regular,Consolas,monospace; --safe-b:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1100px 520px at 50% -12%,rgba(0,230,118,.10),transparent 62%),var(--bg);color:var(--txt);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:0 14px calc(30px + var(--safe-b));min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:70px}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;padding-top:env(safe-area-inset-top,0px);background:rgba(7,11,15,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand b{font-size:14px;white-space:nowrap}
  .brand .sub{font:700 10px/1 var(--mono);color:var(--mut);letter-spacing:1px}
  .gps{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);flex-shrink:0}
  .gps.on{color:var(--green)}
  .gps i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .gps.on i{box-shadow:0 0 0 0 rgba(0,230,118,.6);animation:live 1.6s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(0,230,118,.55)}70%{box-shadow:0 0 0 8px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}
  .pill i{width:8px;height:8px;border-radius:50%;background:currentColor;font-style:normal;animation:live 1.8s infinite}
  .lbl{font:700 11px/1 var(--mono);color:var(--mut);letter-spacing:1.6px;text-transform:uppercase}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
  .row:last-child{border:0}
  .row .k{color:var(--mut);flex-shrink:0}
  .row .v{font-weight:600;text-align:right;word-break:break-word}
  .addr{font-size:16px;font-weight:700;line-height:1.5;margin:6px 0 2px}
  .obs{margin-top:10px;padding:12px;background:rgba(245,158,11,.08);border:1px dashed rgba(245,158,11,.35);border-radius:12px;font-size:13px;color:#EBD9B4;line-height:1.6}
  .actions{display:grid;gap:10px}
  .btn{min-height:54px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;padding:0 18px;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,#00E676,#00B25A);border-color:transparent;color:#04140B;box-shadow:0 8px 20px rgba(0,230,118,.25)}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(59,130,246,.25)}
  .btn.gold{background:linear-gradient(135deg,#F59E0B,#D97706);border-color:transparent;color:#000;box-shadow:0 8px 20px rgba(245,158,11,.25)}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(239,68,68,.25)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gpsbox{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.25)}
  .gpsbox .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,230,118,.6);animation:live 1.6s infinite;flex-shrink:0}
  .gpsbox.off{background:rgba(255,255,255,.03);border-color:var(--line)}
  .gpsbox.off .dot{background:var(--mut);animation:none}
  .gpsbox .t{font-size:12px;color:var(--mut);line-height:1.5}
  .gpsbox .t b{color:var(--txt);display:block;font-size:13px}
  .state{text-align:center;padding:34px 12px}
  .state .big{font-size:46px;margin-bottom:12px}
  .state b{font-size:17px}
  .state p{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.6}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));z-index:120;background:rgba(0,230,118,.95);color:#04140B;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;box-shadow:0 12px 32px rgba(0,230,118,.35);opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #toast.err{background:rgba(239,68,68,.95);color:#fff}
  .login-wrap{max-width:420px;margin:0 auto;padding:0 14px}
  .login-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:28px;box-shadow:0 14px 34px rgba(0,0,0,.35);margin-top:20px}
  .login-card h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .login-card .sub{font-size:13px;color:var(--mut);margin-bottom:22px}
  .login-card label{display:block;font:700 11px/1 var(--mono);color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
  .login-card input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:15px;font-family:inherit;outline:none}
  .login-card input:focus{border-color:var(--green)}
  .login-card .btn{width:100%;margin-top:22px}
  .login-card .err{margin-top:12px;padding:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:10px;font-size:12px;color:#FCA5A5;text-align:center}
  .entrega-item{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .entrega-item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .mapa-box{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);height:280px;background:#0E1A24;position:relative}
  .mapa-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,26,36,.95);color:var(--mut);font-size:13px;z-index:5;flex-direction:column;gap:8px}
  .mapa-loading .spinner{width:32px;height:32px;border:3px solid rgba(0,230,118,.2);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .info-rota{margin-top:10px;padding:14px;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(0,230,118,.1));border:1px solid rgba(59,130,246,.4);border-radius:12px;display:flex;justify-content:space-around;align-items:center}
  .info-rota .item{flex:1;text-align:center}
  .info-rota .item .n{font:800 20px/1 var(--mono);color:var(--green)}
  .info-rota .item .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .info-rota .divisor{width:1px;height:40px;background:var(--line)}
  .logout{margin-top:20px}
  .logo-grande{width:100px;height:100px;margin:0 auto 18px;filter:drop-shadow(0 8px 24px rgba(0,230,118,.4))}
  .logo-titulo{display:flex;align-items:center;gap:10px}
  .logo-titulo svg{width:32px;height:32px;flex-shrink:0}
  .logo-titulo b{font-size:15px}
  .logo-titulo b span{color:var(--green)}
</style>
</head>
<body>

<svg id="logo-svg" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00B25A"/></linearGradient></defs>
  <rect width="100" height="100" rx="22" fill="url(#lg)"/>
  <path d="M20 62 L32 62 L40 44 L60 44 L68 62 L82 62" stroke="#070B0F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="67" r="8" fill="#070B0F"/>
  <circle cx="67" cy="67" r="8" fill="#070B0F"/>
  <rect x="45" y="32" width="10" height="12" rx="3" fill="#070B0F"/>
  <circle cx="50" cy="38" r="2" fill="#00E676"/>
</svg>

<div class="topbar" id="topbar" style="display:none">
  <div class="brand">
    <div class="logo-titulo">
      <svg viewBox="0 0 100 100"><use href="#logo-svg"/></svg>
      <b>OS-PREMIUM <span>Entregador</span></b>
    </div>
  </div>
  <span class="gps" id="gpsBadge"><i></i><span id="gpsTxt">GPS OFF</span></span>
</div>

<div id="app"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
  const SESSION_KEY = 'os_entregador_sessao';
  const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';

  let sessao = null;
  let entregas = [];
  let watchId = null;
  let ultimoEnvioGPS = 0;
  let ultimaRotaCalculada = 0;
  let posicaoAtual = null;
  const mapas = {};
  const cacheGeo = {};

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const moeda = v => (parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width:100%;height:100%"><defs><linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00B25A"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg2)"/><path d="M20 62 L32 62 L40 44 L60 44 L68 62 L82 62" stroke="#070B0F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="67" r="8" fill="#070B0F"/><circle cx="67" cy="67" r="8" fill="#070B0F"/><rect x="45" y="32" width="10" height="12" rx="3" fill="#070B0F"/><circle cx="50" cy="38" r="2" fill="#00E676"/></svg>`;

  function hashSenha(s){
    let h = 5381; const str = String(s);
    for(let i=0;i<str.length;i++) h = ((h<<5)+h+str.charCodeAt(i))>>>0;
    return 'h'+h.toString(36);
  }

  const toast = (msg, err) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = err ? 'show err' : 'show';
    setTimeout(() => { t.className = ''; }, 2600);
  };

  const STATUS = {
    aguardando: { txt:'⏳ Aguardando você aceitar', cor:'#FACC15', bg:'rgba(250,204,21,.14)' },
    aceita:     { txt:'👍 Aceita — pronta para rota', cor:'#3B82F6', bg:'rgba(59,130,246,.14)' },
    em_rota:    { txt:'🛵 Em rota — GPS transmitindo', cor:'#00E676', bg:'rgba(0,230,118,.14)' },
    entregue:   { txt:'✅ Entrega concluída', cor:'#9CA3AF', bg:'rgba(156,163,175,.14)' },
    cancelada:  { txt:'❌ Cancelada pela loja', cor:'#EF4444', bg:'rgba(239,68,68,.14)' },
  };

  async function api(path, method, body){
    const opts = { method, headers:{'Content-Type':'application/json'} };
    if(body) opts.body = JSON.stringify(body);
    return await fetch(FB + path, opts);
  }

  async function tentarLogin(login, senha){
    const r = await api('/entregadores.json','GET');
    const dados = await r.json();
    if(!dados) return { ok:false, erro:'Nenhum entregador cadastrado.' };
    const lista = Object.entries(dados).map(([id,v])=>({id,...v}));
    const ent = lista.find(e => e.login && e.login.toLowerCase() === login.toLowerCase());
    if(!ent) return { ok:false, erro:'Login não encontrado.' };
    if(!ent.ativo) return { ok:false, erro:'Sua conta está desativada. Contate a loja.' };
    if(ent.senhaHash !== hashSenha(senha)) return { ok:false, erro:'Senha incorreta.' };
    return { ok:true, ent };
  }

  function salvarSessao(ent){
    sessao = { id:ent.id, nome:ent.nome, login:ent.login };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
  }
  function carregarSessao(){
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e){ return null; }
  }
  function limparSessao(){
    sessao = null; localStorage.removeItem(SESSION_KEY);
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  }

  async function carregarEntregas(){
    if(!sessao) return;
    try{
      const r = await api('/entregas.json','GET');
      const dados = await r.json();
      if(!dados){ 
        if(entregas.length > 0){
          entregas = [];
          renderLista();
        }
        return; 
      }
      const lista = Object.entries(dados).map(([token,v])=>({token,...v}));
      const novasEntregas = lista.filter(e => e.entregadorId === sessao.id && !['entregue','cancelada'].includes(e.status));
      
      if(JSON.stringify(novasEntregas.map(e=>e.token)) !== JSON.stringify(entregas.map(e=>e.token))){
        entregas = novasEntregas;
        renderLista();
      } else {
        atualizarStatusCards();
      }
    }catch(e){}
  }

  function renderLogin(erro){
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('app').innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="logo-grande">${LOGO_SVG}</div>
          <h2 style="text-align:center">OS-PREMIUM <span style="color:var(--green)">Entregador</span></h2>
          <p class="sub" style="text-align:center">Entre com seu login e senha fornecidos pela loja</p>
          <label>Login</label>
          <input id="inpLogin" type="text" placeholder="ex: adriana" autocomplete="username" />
          <label>Senha</label>
          <input id="inpSenha" type="password" placeholder="••••" autocomplete="current-password" />
          ${erro ? '<div class="err">'+esc(erro)+'</div>' : ''}
          <button class="btn primary" id="btnEntrar">🔐 Entrar</button>
          <p style="margin-top:16px;font-size:11px;color:var(--mut);text-align:center;line-height:1.6">
            Seus dados de acesso foram fornecidos pela loja.<br/>Em caso de dúvida, entre em contato.
          </p>
        </div>
      </div>
    `;
    document.getElementById('btnEntrar').onclick = async () => {
      const login = document.getElementById('inpLogin').value.trim();
      const senha = document.getElementById('inpSenha').value;
      if(!login || !senha){ toast('Preencha login e senha', true); return; }
      const res = await tentarLogin(login, senha);
      if(res.ok){
        salvarSessao(res.ent);
        toast('✅ Bem-vindo, '+res.ent.nome+'!');
        renderApp();
        carregarEntregas();
        setInterval(carregarEntregas, 10000);
      } else {
        renderLogin(res.erro);
      }
    };
    document.getElementById('inpSenha').addEventListener('keypress', e => { if(e.key==='Enter') document.getElementById('btnEntrar').click(); });
  }

  function renderApp(){
    document.getElementById('topbar').style.display = 'flex';
    renderLista();
  }

  function renderLista(){
    const app = document.getElementById('app');

    if(entregas.length === 0){
      app.innerHTML = `
        <div class="wrap">
          <div class="card">
            <div class="state">
              <div class="logo-grande" style="width:80px;height:80px;margin:0 auto 14px">${LOGO_SVG}</div>
              <b>Olá, ${esc(sessao.nome)}!</b>
              <p>Você não tem entregas ativas no momento.<br/>Novas entregas aparecerão aqui automaticamente.</p>
            </div>
          </div>
          <button class="btn red logout" id="btnSair"> Sair da conta</button>
        </div>
      `;
      Object.values(mapas).forEach(m => { if(m.mapa) m.mapa.remove(); });
      for(let k in mapas) delete mapas[k];
    } else {
      app.innerHTML = `
        <div class="wrap" id="listaEntregas"></div>
        <button class="btn red logout" id="btnSair" style="max-width:560px;margin:0 auto">🚪 Sair da conta</button>
      `;
      const lista = document.getElementById('listaEntregas');
      entregas.forEach(e => {
        const card = criarCardEntrega(e);
        lista.appendChild(card);
      });
      setTimeout(() => {
        entregas.forEach(e => inicializarMapa(e));
      }, 300);
    }
    document.getElementById('btnSair').onclick = () => {
      if(confirm('Deseja sair da sua conta?')){
        limparSessao();
        renderLogin();
      }
    };
  }

  function atualizarStatusCards(){
    entregas.forEach(e => {
      const pill = document.getElementById('pill-'+e.token);
      if(pill){
        const st = STATUS[e.status] || STATUS.aguardando;
        pill.style.color = st.cor;
        pill.style.background = st.bg;
        pill.innerHTML = `<i></i>${st.txt}`;
      }
      const btnAcao = document.getElementById('btn-acao-'+e.token);
      if(btnAcao){
        btnAcao.onclick = null; // Remove listener antigo
        if(e.status === 'aguardando'){
          btnAcao.className = 'btn primary';
          btnAcao.innerHTML = '✅ Aceitar entrega';
          btnAcao.onclick = () => executarAcao(e, 'aceitar');
        } else if(e.status === 'aceita'){
          btnAcao.className = 'btn blue';
          btnAcao.innerHTML = '🛵 Iniciar rota';
          btnAcao.onclick = () => executarAcao(e, 'rota');
        } else if(e.status === 'em_rota'){
          btnAcao.className = 'btn gold';
          btnAcao.innerHTML = '📦 Confirmar entrega';
          btnAcao.onclick = () => executarAcao(e, 'entregar');
        }
      }
    });
  }

  function inicializarMapa(e){
    const container = document.getElementById('mapa-'+e.token);
    if(!container || mapas[e.token]) return;

    const mapa = L.map(container, {
      zoomControl: false,
      attributionControl: false,
      preferCanvas: true
    }).setView([-23.55, -46.63], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
    }).addTo(mapa);

    mapas[e.token] = {
      mapa,
      marcadorMoto: null,
      marcadorDestino: null,
      linhaRota: null,
      coordsDestino: null,
      rotaCalculada: false
    };

    if(posicaoAtual) atualizarPosicaoNoMapa(e, posicaoAtual);

    if(e.endereco){
      geocodificarEndereco(e.endereco).then(coords => {
        if(coords){
          mapas[e.token].coordsDestino = coords;
          adicionarDestinoNoMapa(e, coords);
          const origem = posicaoAtual || { lat: -23.5505, lng: -46.6333 };
          traçarRota(e, origem, coords);
        }
        const loading = document.getElementById('mapa-loading-'+e.token);
        if(loading) loading.style.display = 'none';
      });
    } else {
      const loading = document.getElementById('mapa-loading-'+e.token);
      if(loading) loading.innerHTML = '📍 Sem endereço cadastrado';
    }

    setTimeout(() => mapa.invalidateSize(), 400);
  }

  async function geocodificarEndereco(endereco){
    if(cacheGeo[endereco]) return cacheGeo[endereco];
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}&limit=1&countrycodes=br`;
      const r = await fetch(url, { headers: { 'User-Agent': 'OS-Premium-Entregador/1.0' } });
      const d = await r.json();
      if(d && d.length > 0){
        const c = { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
        cacheGeo[endereco] = c;
        return c;
      }
    }catch(e){}
    return null;
  }

  async function traçarRota(e, origem, destino){
    const m = mapas[e.token];
    if(!m) return;

    const agora = Date.now();
    if(m.rotaCalculada && (agora - ultimaRotaCalculada) < 30000) return;
    ultimaRotaCalculada = agora;
    m.rotaCalculada = true;

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);

    try{
      const url = `${OSRM_URL}${origem.lng},${origem.lat};${destino.lng},${destino.lat}?overview=full&geometries=geojson`;
      const r = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);
      const d = await r.json();

      if(d.code === 'Ok' && d.routes && d.routes.length > 0){
        const rota = d.routes[0];
        const coords = rota.geometry.coordinates.map(c => [c[1], c[0]]);
        desenharRota(e, coords, rota.distance, rota.duration);
      } else {
        desenharLinhaReta(e, origem, destino);
      }
    }catch(err){
      clearTimeout(timeout);
      desenharLinhaReta(e, origem, destino);
    }
  }

  function desenharRota(e, coords, distancia, duracao){
    const m = mapas[e.token];
    if(!m) return;
    if(m.linhaRota) m.mapa.removeLayer(m.linhaRota);
    m.linhaRota = L.polyline(coords, {
      color: '#3B82F6',
      weight: 6,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(m.mapa);
    m.mapa.fitBounds(m.linhaRota.getBounds(), { padding: [30, 30] });
    atualizarInfoRota(e, distancia, duracao);
  }

  function desenharLinhaReta(e, origem, destino){
    const m = mapas[e.token];
    if(!m) return;
    if(m.linhaRota) m.mapa.removeLayer(m.linhaRota);
    m.linhaRota = L.polyline(
      [[origem.lat, origem.lng], [destino.lat, destino.lng]],
      { color: '#3B82F6', weight: 4, opacity: 0.7, dashArray: '8 8' }
    ).addTo(m.mapa);
    const bounds = L.latLngBounds([[origem.lat, origem.lng], [destino.lat, destino.lng]]);
    m.mapa.fitBounds(bounds, { padding: [30, 30] });
    const dist = calcularDistancia(origem.lat, origem.lng, destino.lat, destino.lng);
    atualizarInfoRota(e, parseFloat(dist)*1000, parseFloat(dist)*1000/30*60);
  }

  function atualizarInfoRota(e, distanciaMetros, duracaoSeg){
    const elInfo = document.getElementById('info-rota-'+e.token);
    if(!elInfo) return;
    const distKm = (distanciaMetros/1000).toFixed(1);
    const tempoMin = Math.max(1, Math.round(duracaoSeg/60));
    elInfo.innerHTML = `
      <div class="item"><div class="n">${distKm} km</div><div class="l">Distância</div></div>
      <div class="divisor"></div>
      <div class="item"><div class="n">${tempoMin} min</div><div class="l">Tempo est.</div></div>
    `;
  }

  function adicionarDestinoNoMapa(e, coords){
    const m = mapas[e.token];
    if(!m) return;
    const iconeDestino = L.divIcon({
      html: '<div style="font-size:30px;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.7))">📍</div>',
      className: '', iconSize: [32, 32], iconAnchor: [16, 32]
    });
    m.marcadorDestino = L.marker([coords.lat, coords.lng], { icon: iconeDestino }).addTo(m.mapa)
      .bindPopup(`<b>📍 Destino</b><br/><b>${esc(e.cliente)}</b><br/>${esc(e.endereco)}`);
  }

  function atualizarPosicaoNoMapa(e, pos){
    const m = mapas[e.token];
    if(!m) return;
    const iconeMoto = L.divIcon({
      html: '<div style="font-size:28px;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.7))">🛵</div>',
      className: '', iconSize: [32, 32], iconAnchor: [16, 16]
    });
    if(!m.marcadorMoto){
      m.marcadorMoto = L.marker([pos.lat, pos.lng], { icon: iconeMoto }).addTo(m.mapa)
        .bindPopup('<b>🛵 Você está aqui</b>');
    } else {
      m.marcadorMoto.setLatLng([pos.lat, pos.lng]);
    }
  }

  function calcularDistancia(lat1, lng1, lat2, lng2){
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2-lat1);
    const dLng = toRad(lng2-lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
  }

  function criarCardEntrega(e){
    const st = STATUS[e.status] || STATUS.aguardando;
    const tel = String(e.telefone||'').replace(/\D/g,'');
    const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.endereco || e.cliente || '');
    const div = document.createElement('div');
    div.className = 'entrega-item';
    div.dataset.token = e.token;
    div.id = 'card-'+e.token;

    let acaoHtml = '';
    if(e.status === 'aguardando') acaoHtml = '<button class="btn primary" id="btn-acao-'+e.token+'">✅ Aceitar entrega</button>';
    else if(e.status === 'aceita') acaoHtml = '<button class="btn blue" id="btn-acao-'+e.token+'">🛵 Iniciar rota</button>';
    else if(e.status === 'em_rota') acaoHtml = '<button class="btn gold" id="btn-acao-'+e.token+'">📦 Confirmar entrega</button>';

    const itensHtml = Array.isArray(e.itens) && e.itens.length > 0
      ? '<div class="lbl" style="margin-top:10px"> O que levar (' + e.itens.length + ' itens)</div><div style="margin-top:6px">' + e.itens.map(it => '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px"><span>' + (it.tipo === 'servico' ? ' ' : '📦 ') + esc(it.nome) + '</span><span style="color:var(--green);font-weight:700">x' + it.quantidade + '</span></div>').join('') + '</div>'
      : '';

    div.innerHTML = `
      <div class="head">
        <span class="pill" id="pill-${e.token}" style="color:${st.cor};background:${st.bg}"><i></i>${st.txt}</span>
        <span style="font:800 18px/1 var(--mono)">OS #${esc(e.numero)}</span>
      </div>
      <div class="lbl">Cliente</div>
      <div class="addr">👤 ${esc(e.cliente)||'—'}</div>
      ${e.endereco ? '<div class="lbl" style="margin-top:10px">Endereço de entrega</div><div class="addr">📍 ' + esc(e.endereco) + '</div>' : '<p style="margin-top:8px;font-size:12px;color:var(--mut)">Sem endereço — combine por telefone.</p>'}
      ${itensHtml}
      ${e.observacoes ? '<div class="obs">📝 ' + esc(e.observacoes) + '</div>' : ''}
      <div class="mapa-box" id="mapa-${e.token}">
        <div class="mapa-loading" id="mapa-loading-${e.token}">
          <div class="spinner"></div>
          <div>Carregando mapa e rota...</div>
        </div>
      </div>
      <div class="info-rota" id="info-rota-${e.token}">
        <div class="item"><div class="n">—</div><div class="l">Distância</div></div>
        <div class="divisor"></div>
        <div class="item"><div class="n">—</div><div class="l">Tempo</div></div>
      </div>
      <div style="margin-top:10px">
        <div class="row"><span class="k">Valor a receber</span><span class="v" style="color:var(--green)">R$ ${moeda(e.valor)}</span></div>
        <div class="row"><span class="k">Telefone</span><span class="v">${esc(e.telefone)||'—'}</span></div>
      </div>
      <div class="actions" style="margin-top:14px">
        ${tel ? '<div class="grid2"><a class="btn" href="tel:'+tel+'">📞 Ligar</a><a class="btn" target="_blank" href="'+maps+'">🗺️ Google Maps</a></div>' : '<a class="btn" target="_blank" href="'+maps+'">🗺️ Google Maps</a>'}
        ${acaoHtml}
      </div>
      <div class="gpsbox ${watchId!==null?'':'off'}" id="gpsBox-${e.token}">
        <div class="dot"></div>
        <div class="t" id="gpsInfo-${e.token}">
          <b>${watchId!==null ? 'GPS transmitindo ao vivo' : 'GPS desligado'}</b>
          ${watchId!==null ? 'A loja vê sua posição no mapa.' : 'Ele liga ao iniciar a rota.'}
        </div>
      </div>
    `;
    
    // Adiciona event listener diretamente
    const btnAcao = div.querySelector('#btn-acao-'+e.token);
    if(btnAcao){
      if(e.status === 'aguardando') btnAcao.onclick = () => executarAcao(e, 'aceitar');
      else if(e.status === 'aceita') btnAcao.onclick = () => executarAcao(e, 'rota');
      else if(e.status === 'em_rota') btnAcao.onclick = () => executarAcao(e, 'entregar');
    }
    
    return div;
  }

  async function executarAcao(e, acao){
    console.log('Ação executada:', acao, 'Token:', e.token);
    
    if(acao === 'aceitar'){
      toast('✅ Entrega aceita!');
      await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{status:'aceita',aceitaEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    } else if(acao === 'rota'){
      console.log('Iniciando GPS...');
      if(!('geolocation' in navigator)){ 
        toast('❌ Este aparelho não tem GPS', true); 
        return; 
      }
      
      // Atualiza badge GPS imediatamente
      const badge = document.getElementById('gpsBadge');
      const txt = document.getElementById('gpsTxt');
      if(badge) badge.className = 'gps on';
      if(txt) txt.textContent = 'GPS ON';
      
      // Atualiza todos os gpsBox
      document.querySelectorAll('.gpsbox').forEach(box => {
        box.className = 'gpsbox';
        const t = box.querySelector('.t b');
        if(t) t.textContent = 'GPS transmitindo ao vivo';
      });
      
      iniciarGPS();
      toast(' Rota iniciada! GPS ligado.');
      await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{status:'em_rota',rotaIniciadaEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    } else if(acao === 'entregar'){
      if(!confirm('Confirmar que o cliente recebeu o pedido?')) return;
      pararGPS();
      toast(' Entrega confirmada!');
      await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{status:'entregue',entregueEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    }
    setTimeout(carregarEntregas, 1000);
  }

  function iniciarGPS(){
    if(watchId !== null){
      console.log('GPS já está ativo');
      return;
    }
    
    console.log('Solicitando permissão de GPS...');
    watchId = navigator.geolocation.watchPosition(
      pos => {
        console.log('GPS recebido:', pos.coords.latitude, pos.coords.longitude);
        const { latitude, longitude, accuracy, speed } = pos.coords;
        posicaoAtual = { lat: latitude, lng: longitude };
        const agora = Date.now();
        
        if(agora - ultimoEnvioGPS >= 5000){
          ultimoEnvioGPS = agora;
          entregas.forEach(e => {
            if(e.status === 'em_rota'){
              api('/posicoes/'+encodeURIComponent(e.token)+'.json','PUT',{
                lat:latitude,
                lng:longitude,
                precisao:Math.round(accuracy||0),
                velocidade:Math.round((speed||0)*3.6),
                timestamp:new Date().toISOString()
              }).catch(()=>{});
            }
          });
        }
        
        entregas.forEach(e => {
          atualizarPosicaoNoMapa(e, posicaoAtual);
          const m = mapas[e.token];
          if(m && m.coordsDestino && (agora - ultimaRotaCalculada) >= 30000){
            traçarRota(e, posicaoAtual, m.coordsDestino);
          }
        });
      },
      err => {
        console.error('Erro GPS:', err);
        toast('❌ GPS negado: ' + err.message, true);
        const txt = document.getElementById('gpsTxt');
        if(txt) txt.textContent = 'GPS OFF';
      },
      { enableHighAccuracy:true, maximumAge:3000, timeout:15000 }
    );
  }

  function pararGPS(){
    if(watchId !== null){ 
      navigator.geolocation.clearWatch(watchId); 
      watchId = null;
      posicaoAtual = null;
    }
  }

  (function init(){
    const s = carregarSessao();
    if(s){
      sessao = s;
      renderApp();
      carregarEntregas();
      setInterval(carregarEntregas, 10000);
    } else {
      renderLogin();
    }
  })();
</script>
