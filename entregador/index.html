<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00E676" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="OS Entregador" />
<title>Entregador — OS-PREMIUM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300E676'/><path d='M20 62 L32 62 L40 44 L60 44 L68 62 L82 62' stroke='%23070B0F' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='33' cy='67' r='8' fill='%23070B0F'/><circle cx='67' cy='67' r='8' fill='%23070B0F'/><rect x='44' y='30' width='12' height='12' rx='3' fill='%23070B0F'/></svg>" />
<style>
  :root{ --bg:#070B0F; --card:#0F1720; --card2:#121D28; --line:rgba(255,255,255,.07); --txt:#E6EDF3; --mut:#8B98A5; --green:#00E676; --gold:#F59E0B; --red:#EF4444; --blue:#3B82F6; --purple:#A855F7; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1100px 520px at 50% -12%,rgba(0,230,118,.10),transparent 62%),var(--bg);color:var(--txt);font:15px/1.55 -apple-system,sans-serif;padding:0 14px 30px;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:70px}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:rgba(7,11,15,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand b{font-size:14px}
  .gps-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
  .gps-badge.on{background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.3);color:var(--green)}
  .gps-badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .gps-badge.on i{box-shadow:0 0 0 0 rgba(0,230,118,.6);animation:live 1.6s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(0,230,118,.55)}70%{box-shadow:0 0 0 8px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}
  .lbl{font:700 11px/1 ui-monospace,monospace;color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:6px}
  .addr{font-size:16px;font-weight:700;line-height:1.5;margin:6px 0}
  .btn{min-height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;padding:0 16px;text-decoration:none;width:100%}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,#00E676,#00B25A);border-color:transparent;color:#04140B}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB);border-color:transparent;color:#fff}
  .btn.gold{background:linear-gradient(135deg,#F59E0B,#D97706);border-color:transparent;color:#000}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626);border-color:transparent;color:#fff}
  .btn.purple{background:linear-gradient(135deg,#A855F7,#7C3AED);border-color:transparent;color:#fff}
  .btn.nav{background:linear-gradient(135deg,#8B5CF6,#7C3AED);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .state{text-align:center;padding:34px 12px}
  .state .big{font-size:46px;margin-bottom:12px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:120;background:rgba(0,230,118,.95);color:#04140B;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #toast.err{background:rgba(239,68,68,.95);color:#fff}
  .login-wrap{max-width:420px;margin:0 auto;padding:0 14px}
  .login-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:28px;margin-top:20px}
  .login-card h2{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center}
  .login-card label{display:block;font:700 11px/1 ui-monospace,monospace;color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin:14px 0 6px}
  .login-card input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:15px;outline:none}
  .login-card input:focus{border-color:var(--green)}
  .entrega-item{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
  .entrega-item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .logo-grande{width:100px;height:100px;margin:0 auto 18px}
  .logo-titulo{display:flex;align-items:center;gap:10px}
  .logo-titulo svg{width:32px;height:32px}
  .logo-titulo b{font-size:15px}
  .logo-titulo b span{color:var(--green)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99990;padding:20px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:400px}
  .modal h3{margin:0 0 16px;font-size:18px;color:var(--blue)}
  .modal .btn{margin-bottom:10px}
  .diag-card{background:linear-gradient(180deg,#0a1418,#070d10);border:1px solid rgba(0,230,118,.25);border-radius:20px;padding:16px}
  .diag-card h4{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--green)}
  .diag-card h4 .dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
  .diag-card h4 .dot.on{background:var(--green);animation:live 1.6s infinite}
  .diag-card h4 .dot.err{background:var(--red)}
  .diag-log{background:#050809;border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.5 ui-monospace,monospace;max-height:140px;overflow-y:auto;color:#9CA3AF}
  .diag-log .l{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.04)}
  .diag-log .l:last-child{border-bottom:none}
  .diag-log .l .t{color:#6B7280;margin-right:6px}
  .diag-log .l.ok{color:var(--green)}
  .diag-log .l.er{color:var(--red)}
  .diag-log .l.in{color:var(--blue)}
  .diag-coords{margin-top:8px;padding:8px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.25);border-radius:8px;font:11px ui-monospace,monospace;color:var(--green);display:none}
  .diag-coords.on{display:block}
</style>
</head>
<body>

<svg id="logo-svg" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00B25A"/></linearGradient></defs>
  <rect width="100" height="100" rx="22" fill="url(#lg)"/>
  <path d="M20 62 L32 62 L40 44 L60 44 L68 62 L82 62" stroke="#070B0F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="67" r="8" fill="#070B0F"/>
  <circle cx="67" cy="67" r="8" fill="#070B0F"/>
  <rect x="45" y="32" width="10" height="12" rx="3" fill="#070B0F"/>
  <circle cx="50" cy="38" r="2" fill="#00E676"/>
</svg>

<div class="topbar" id="topbar" style="display:none">
  <div class="brand">
    <div class="logo-titulo">
      <svg viewBox="0 0 100 100"><use href="#logo-svg"/></svg>
      <b>OS-PREMIUM <span>Entregador</span></b>
    </div>
  </div>
  <div class="gps-badge" id="gpsBadge"><i></i><span id="gpsTxt">GPS OFF</span></div>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
const SESSION_KEY = 'os_entregador_sessao';

let sessao = null;
let entregas = [];
let watchId = null;
let posicaoAtual = null;
let gpsAtivo = false;
let gpsLogs = [];
let testandoGps = false;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width:100%;height:100%"><defs><linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00B25A"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg2)"/><path d="M20 62 L32 62 L40 44 L60 44 L68 62 L82 62" stroke="#070B0F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="67" r="8" fill="#070B0F"/><circle cx="67" cy="67" r="8" fill="#070B0F"/><rect x="45" y="32" width="10" height="12" rx="3" fill="#070B0F"/><circle cx="50" cy="38" r="2" fill="#00E676"/></svg>`;

function hashSenha(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(36); }

const toast = (msg, err) => {
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.className=err?'show err':'show';
  setTimeout(()=>t.className='',3000);
};

const STATUS = {
  aguardando: { txt:'⏳ Aguardando', cor:'#FACC15', bg:'rgba(250,204,21,.14)' },
  aceita:     { txt:'👍 Aceita',      cor:'#3B82F6', bg:'rgba(59,130,246,.14)' },
  em_rota:    { txt:'🛵 Em rota',     cor:'#00E676', bg:'rgba(0,230,118,.14)' },
  entregue:   { txt:'✅ Entregue',    cor:'#9CA3AF', bg:'rgba(156,163,175,.14)' },
  cancelada:  { txt:'❌ Cancelada',   cor:'#EF4444', bg:'rgba(239,68,68,.14)' },
  recusada:   { txt:'🚫 Recusada',    cor:'#6B7280', bg:'rgba(107,114,128,.14)' },
};

function addLog(msg, type='in'){
  const now = new Date();
  const time = now.toLocaleTimeString('pt-BR');
  gpsLogs.unshift({time, msg, type});
  if(gpsLogs.length > 30) gpsLogs.pop();
  atualizarDiagnostico();
}

function atualizarDiagnostico(){
  const dot = document.getElementById('gps-dot');
  const logBox = document.getElementById('gps-log-box');
  const coordsBox = document.getElementById('gps-coords-box');
  
  if(dot){
    dot.className = 'dot' + (gpsAtivo ? ' on' : (gpsLogs.some(l=>l.type==='er') ? ' err' : ''));
  }
  if(logBox){
    if(gpsLogs.length === 0){
      logBox.innerHTML = '<div class="l in"><span class="t">--:--:--</span>Aguardando...</div>';
    } else {
      logBox.innerHTML = gpsLogs.map(l => 
        `<div class="l ${l.type}"><span class="t">${l.time}</span>${esc(l.msg)}</div>`
      ).join('');
    }
  }
  if(coordsBox){
    if(posicaoAtual){
      coordsBox.className = 'diag-coords on';
      coordsBox.innerHTML = `📍 ${posicaoAtual.lat.toFixed(5)}, ${posicaoAtual.lng.toFixed(5)}<br/>📊 Precisão: ${Math.round(posicaoAtual.accuracy||0)}m`;
    } else {
      coordsBox.className = 'diag-coords';
    }
  }
}

async function api(path, method, body){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  return await fetch(FB + path, opts);
}

async function tentarLogin(login, senha){
  const r = await api('/entregadores.json','GET');
  const dados = await r.json();
  if(!dados) return { ok:false, erro:'Nenhum entregador cadastrado.' };
  const lista = Object.entries(dados).map(([id,v])=>({id,...v}));
  const ent = lista.find(e => e.login && e.login.toLowerCase() === login.toLowerCase());
  if(!ent) return { ok:false, erro:'Login não encontrado.' };
  if(!ent.ativo) return { ok:false, erro:'Sua conta está desativada.' };
  if(ent.senhaHash !== hashSenha(senha)) return { ok:false, erro:'Senha incorreta.' };
  return { ok:true, ent };
}

function salvarSessao(ent){ sessao={id:ent.id,nome:ent.nome,login:ent.login}; localStorage.setItem(SESSION_KEY,JSON.stringify(sessao)); }
function carregarSessao(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;} }
function limparSessao(){ sessao=null; localStorage.removeItem(SESSION_KEY); pararGPS(); }

async function carregarEntregas(){
  if(!sessao) return;
  try{
    const r = await api('/entregas.json','GET');
    const dados = await r.json();
    if(!dados){ if(entregas.length>0){entregas=[];renderTudo();} return; }
    const lista = Object.entries(dados).map(([token,v])=>({token,...v}));
    // Mostra TODAS as entregas do entregador (incluindo recusadas/canceladas para histórico)
    const novas = lista.filter(e => e.entregadorId===sessao.id);
    const mudou = JSON.stringify(novas.map(e=>e.token+e.status)) !== JSON.stringify(entregas.map(e=>e.token+e.status));
    entregas = novas;
    if(mudou) renderTudo();
  }catch(e){
    addLog('Erro ao carregar entregas: '+e.message, 'er');
  }
}

function renderLogin(erro){
  document.getElementById('topbar').style.display='none';
  document.getElementById('app').innerHTML=`
    <div class="login-wrap">
      <div class="login-card">
        <div class="logo-grande">${LOGO_SVG}</div>
        <h2>OS-PREMIUM <span style="color:var(--green)">Entregador</span></h2>
        <p style="text-align:center;color:var(--mut);font-size:13px;margin-bottom:22px">Entre com seu login e senha</p>
        <label>Login</label>
        <input id="inpLogin" type="text" placeholder="ex: adriana" />
        <label>Senha</label>
        <input id="inpSenha" type="password" placeholder="••••" />
        ${erro?'<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:10px;font-size:12px;color:#FCA5A5;text-align:center">'+esc(erro)+'</div>':''}
        <button class="btn primary" id="btnEntrar" style="margin-top:22px"> Entrar</button>
      </div>
    </div>`;
  document.getElementById('btnEntrar').onclick=async()=>{
    const login=document.getElementById('inpLogin').value.trim();
    const senha=document.getElementById('inpSenha').value;
    if(!login||!senha){toast('Preencha login e senha',true);return;}
    const res=await tentarLogin(login,senha);
    if(res.ok){ 
      salvarSessao(res.ent); 
      toast('✅ Bem-vindo, '+res.ent.nome+'!'); 
      renderTudo(); 
      carregarEntregas(); 
      setInterval(carregarEntregas,8000); 
    } else {
      renderLogin(res.erro);
    }
  };
  document.getElementById('inpSenha').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('btnEntrar').click();});
}

function renderTudo(){
  const app = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  
  if(!sessao){
    renderLogin();
    return;
  }
  
  topbar.style.display='flex';
  
  let html = `<div class="wrap">`;
  
  // DIAGNÓSTICO GPS - SEMPRE VISÍVEL
  html += `
    <div class="diag-card">
      <h4><div class="dot" id="gps-dot"></div>🛰️ Diagnóstico GPS</h4>
      <div class="diag-log" id="gps-log-box"></div>
      <div class="diag-coords" id="gps-coords-box"></div>
      <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn ghost" id="btnTestarGps" style="min-height:40px;font-size:12px">📡 Testar GPS</button>
        ${gpsAtivo ? '<button class="btn ghost" id="btnPararGps" style="min-height:40px;font-size:12px;color:var(--red)">⏹️ Parar GPS</button>' : ''}
      </div>
    </div>
  `;
  
  if(entregas.length===0){
    html += `
      <div class="card">
        <div class="state">
          <div class="logo-grande" style="width:80px;height:80px;margin:0 auto 14px">${LOGO_SVG}</div>
          <b>Olá, ${esc(sessao.nome)}!</b>
          <p style="margin-top:8px;color:var(--mut)">Você não tem entregas no momento.</p>
        </div>
      </div>`;
  } else {
    entregas.forEach(e => {
      html += criarCardHTML(e);
    });
  }
  
  html += `<button class="btn red" id="btnSair" style="max-width:560px;margin:0 auto">🚪 Sair da conta</button>`;
  html += `</div>`;
  
  app.innerHTML = html;
  
  // Atribui handlers DOS BOTÕES
  const btnTestar = document.getElementById('btnTestarGps');
  if(btnTestar) btnTestar.onclick = () => ativarGPS(true);
  
  const btnParar = document.getElementById('btnPararGps');
  if(btnParar) btnParar.onclick = () => pararGPS();
  
  const btnSair = document.getElementById('btnSair');
  if(btnSair) btnSair.onclick = () => { if(confirm('Deseja sair?')){limparSessao();renderLogin();} };
  
  entregas.forEach(e => {
    const btnAceitar = document.getElementById('btn-aceitar-'+e.token);
    if(btnAceitar) btnAceitar.onclick = () => aceitarEntrega(e);
    
    const btnRota = document.getElementById('btn-rota-'+e.token);
    if(btnRota) btnRota.onclick = () => iniciarRota(e);
    
    const btnConfirmar = document.getElementById('btn-confirmar-'+e.token);
    if(btnConfirmar) btnConfirmar.onclick = () => confirmarEntrega(e);
    
    const btnRecusar = document.getElementById('btn-recusar-'+e.token);
    if(btnRecusar) btnRecusar.onclick = () => recusarEntrega(e);
    
    const btnNavegar = document.getElementById('btn-navegar-'+e.token);
    if(btnNavegar) btnNavegar.onclick = () => abrirNavegacao(e);
  });
  
  atualizarDiagnostico();
}

function criarCardHTML(e){
  const st = STATUS[e.status] || STATUS.aguardando;
  const tel = String(e.telefone||'').replace(/\D/g,'');
  
  let botoesAcao = '';
  if(e.status === 'aguardando'){
    botoesAcao = `
      <button class="btn primary" id="btn-aceitar-${e.token}">✅ Aceitar entrega</button>
      <button class="btn red" id="btn-recusar-${e.token}">🚫 Recusar entrega</button>
    `;
  } else if(e.status === 'aceita'){
    botoesAcao = `<button class="btn blue" id="btn-rota-${e.token}">🛵 Iniciar rota</button>`;
  } else if(e.status === 'em_rota'){
    botoesAcao = `<button class="btn gold" id="btn-confirmar-${e.token}">📦 Confirmar entrega</button>`;
  } else if(e.status === 'entregue' || e.status === 'recusada' || e.status === 'cancelada'){
    botoesAcao = `<div style="text-align:center;padding:8px;color:var(--mut);font-size:13px">Entrega ${st.txt.toLowerCase()}</div>`;
  }
  
  const itensHtml = Array.isArray(e.itens) && e.itens.length > 0
    ? '<div class="lbl" style="margin-top:10px">📦 O que levar ('+e.itens.length+' itens)</div><div style="margin-top:6px">'+e.itens.map(it=>'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px"><span>'+(it.tipo==='servico'?'🔧 ':'📦 ')+esc(it.nome)+'</span><span style="color:var(--green);font-weight:700">x'+it.quantidade+'</span></div>').join('')+'</div>'
    : '';
  
  return `
    <div class="entrega-item">
      <div class="head">
        <span class="pill" style="color:${st.cor};background:${st.bg}">${st.txt}</span>
        <span style="font:800 18px/1 ui-monospace,monospace">OS #${esc(e.numero)}</span>
      </div>
      <div class="lbl">Cliente</div>
      <div class="addr">👤 ${esc(e.cliente)||'—'}</div>
      ${e.endereco?'<div class="lbl" style="margin-top:10px">Endereço de entrega</div><div class="addr"> '+esc(e.endereco)+'</div>':'<p style="margin-top:8px;font-size:12px;color:var(--mut)">Sem endereço — combine por telefone.</p>'}
      ${itensHtml}
      ${e.observacoes?'<div style="margin-top:10px;padding:12px;background:rgba(245,158,11,.08);border:1px dashed rgba(245,158,11,.35);border-radius:12px;font-size:13px;color:#EBD9B4">📝 '+esc(e.observacoes)+'</div>':''}
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px"><span style="color:var(--mut)">Valor</span><span style="font-weight:600;color:var(--green)">R$ ${(parseFloat(e.valor)||0).toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;font-size:14px"><span style="color:var(--mut)">Telefone</span><span style="font-weight:600">${esc(e.telefone)||'—'}</span></div>
      </div>
      <div style="margin-top:14px;display:grid;gap:10px">
        ${botoesAcao}
        ${e.endereco ? (tel ? '<div class="grid2"><a class="btn ghost" href="tel:'+tel+'" style="min-height:44px;font-size:13px">📞 Ligar</a><button class="btn nav" id="btn-navegar-'+e.token+'" style="min-height:44px;font-size:13px">️ Navegar</button></div>' : '<button class="btn nav" id="btn-navegar-'+e.token+'" style="min-height:44px;font-size:13px">️ Navegar</button>') : ''}
      </div>
    </div>
  `;
}

function abrirNavegacao(e){
  if(!e.endereco){toast('❌ Sem endereço',true);return;}
  const encoded = encodeURIComponent(e.endereco);
  const app = document.getElementById('app');
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <h3>🗺️ Escolha o app</h3>
      <p style="margin-bottom:16px;color:var(--mut);font-size:13px">${esc(e.endereco)}</p>
      <button class="btn" id="btnWaze" style="background:#33CCFF;color:#000">🚗 Waze</button>
      <button class="btn" id="btnGoogle" style="background:#4285F4;color:#fff">🗺️ Google Maps</button>
      <button class="btn ghost" id="btnFechar" style="margin-top:10px">Cancelar</button>
    </div>`;
  app.appendChild(modal);
  document.getElementById('btnWaze').onclick = () => { window.open('https://waze.com/ul?q='+encoded+'&navigate=yes','_blank'); modal.remove(); };
  document.getElementById('btnGoogle').onclick = () => { window.open('https://www.google.com/maps/search/?api=1&query='+encoded,'_blank'); modal.remove(); };
  document.getElementById('btnFechar').onclick = () => modal.remove();
  modal.onclick = (ev) => { if(ev.target===modal) modal.remove(); };
}

// ✅ ACEITAR ENTREGA + ATIVAR GPS
async function aceitarEntrega(e){
  addLog('Clicou em Aceitar entrega', 'in');
  toast('⏳ Ativando GPS...');
  
  const gpsOk = await ativarGPS();
  if(!gpsOk){
    toast(' GPS não ativou. Não é possível aceitar.', true);
    return;
  }
  
  try{
    await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{
      status:'aceita',
      aceitaEm:new Date().toISOString(),
      atualizadoEm:new Date().toISOString()
    });
    toast('✅ Entrega aceita!');
    addLog('Entrega aceita com sucesso', 'ok');
    setTimeout(carregarEntregas, 500);
  }catch(err){
    toast('❌ Erro: '+err.message, true);
    addLog('Erro ao aceitar: '+err.message, 'er');
  }
}

// 📦 CONFIRMAR ENTREGA

// 📡 ATIVAR GPS - FUNÇÃO SIMPLES E DIRETA
async function ativarGPS(modoTeste = false){
  if(testandoGps){
    addLog('Já está testando GPS...', 'in');
    return false;
  }
  
  if(gpsAtivo){
    addLog('GPS já está ativo', 'ok');
    if(modoTeste) toast('✅ GPS já está ativo!');
    return true;
  }
  
  testandoGps = true;
  addLog('Iniciando teste de GPS...', 'in');
  if(modoTeste) toast('⏳ Testando GPS...');
  
  // 1. Verifica suporte
  if(!('geolocation' in navigator)){
    addLog(' Navegador NÃO suporta geolocation', 'er');
    toast('❌ Seu navegador não suporta GPS', true);
    testandoGps = false;
    return false;
  }
  addLog('✅ Navegador suporta geolocation', 'ok');
  
  // 2. Verifica HTTPS
  const isHttps = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if(!isHttps){
    addLog('⚠️ Site NÃO está em HTTPS - GPS pode falhar', 'er');
  } else {
    addLog('✅ Conexão segura (HTTPS)', 'ok');
  }
  
  // 3. Tenta obter posição
  addLog('📡 Solicitando permissão de localização...', 'in');
  
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const {latitude, longitude, accuracy} = pos.coords;
        posicaoAtual = {lat: latitude, lng: longitude, accuracy, timestamp: new Date().toISOString()};
        gpsAtivo = true;
        testandoGps = false;
        
        addLog(`✅ Posição obtida: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`, 'ok');
        addLog(` Precisão: ${Math.round(accuracy)}m`, 'in');
        
        // Atualiza badge no topo
        const badge = document.getElementById('gpsBadge');
        const txt = document.getElementById('gpsTxt');
        if(badge) badge.className = 'gps-badge on';
        if(txt) txt.textContent = 'GPS ON';
        
        atualizarDiagnostico();
        
        // 4. Inicia watchPosition para monitoramento contínuo
        addLog('🔄 Iniciando monitoramento contínuo...', 'in');
        watchId = navigator.geolocation.watchPosition(
          (p) => {
            const {latitude, longitude, accuracy, speed} = p.coords;
            posicaoAtual = {lat: latitude, lng: longitude, accuracy, speed, timestamp: new Date().toISOString()};
            addLog(`📍 Atualização: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`, 'ok');
            transmitirPosicao(latitude, longitude, accuracy, speed);
            atualizarDiagnostico();
          },
          (err) => {
            let msg = 'Erro';
            if(err.code===1) msg='Permissão negada';
            if(err.code===2) msg='Localização indisponível';
            if(err.code===3) msg='Timeout';
            addLog(`❌ watchPosition: ${msg}`, 'er');
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 3000 }
        );
        
        if(modoTeste) toast('✅ GPS ativado com sucesso!');
        resolve(true);
      },
      (err) => {
        testandoGps = false;
        let msg = 'Erro desconhecido';
        if(err.code===1) msg='Permissão NEGADA pelo usuário';
        if(err.code===2) msg='Localização indisponível (GPS desligado?)';
        if(err.code===3) msg='Timeout - demorou muito';
        addLog(`❌ getCurrentPosition: ${msg} (código ${err.code})`, 'er');
        if(modoTeste) toast('❌ '+msg, true);
        resolve(false);
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

function transmitirPosicao(lat, lng, accuracy, speed){
  if(!posicaoAtual) return;
  entregas.forEach(e => {
    if(e.status === 'aceita' || e.status === 'em_rota'){
      api('/posicoes/'+encodeURIComponent(e.token)+'.json','PUT',{
        lat, lng,
        precisao: Math.round(accuracy || 0),
        velocidade: Math.round((speed || 0) * 3.6),
        timestamp: new Date().toISOString(),
        entregadorId: sessao.id
      }).catch(err => addLog('Erro transmissão: '+err.message, 'er'));
    }
  });
}

function pararGPS(){
  if(watchId !== null){
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  gpsAtivo = false;
  posicaoAtual = null;
  testandoGps = false;
  
  const badge = document.getElementById('gpsBadge');
  const txt = document.getElementById('gpsTxt');
  if(badge) badge.className = 'gps-badge';
  if(txt) txt.textContent = 'GPS OFF';
  
  addLog('⏹️ GPS parado', 'in');
  atualizarDiagnostico();
}

// INICIALIZAÇÃO
(function init(){
  const s = carregarSessao();
  if(s){
    sessao = s;
    renderTudo();
    carregarEntregas();
    setInterval(carregarEntregas, 8000);
  } else {
    renderLogin();
  }
})();
</script>
