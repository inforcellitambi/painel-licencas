<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00E676" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="OS Entregador" />
<title>Entregador — OS-PREMIUM</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300E676'/><path d='M20 62 L32 62 L40 44 L60 44 L68 62 L82 62' stroke='%23070B0F' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='33' cy='67' r='8' fill='%23070B0F'/><circle cx='67' cy='67' r='8' fill='%23070B0F'/><rect x='44' y='30' width='12' height='12' rx='3' fill='%23070B0F'/></svg>" />

<style>
  :root{ --bg:#070B0F; --card:#0F1720; --card2:#121D28; --line:rgba(255,255,255,.07); --txt:#E6EDF3; --mut:#8B98A5; --green:#00E676; --gold:#F59E0B; --red:#EF4444; --blue:#3B82F6; --r:20px; --mono:ui-monospace,monospace; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1100px 520px at 50% -12%,rgba(0,230,118,.10),transparent 62%),var(--bg);color:var(--txt);font:15px/1.55 -apple-system,sans-serif;padding:0 14px 30px;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:70px}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:rgba(7,11,15,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand b{font-size:14px}
  .brand .sub{font:700 10px/1 var(--mono);color:var(--mut)}
  .gps-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .gps-status.on{color:var(--green);background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.3)}
  .gps-status.off{color:var(--mut)}
  .gps-status i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .gps-status.on i{box-shadow:0 0 0 0 rgba(0,230,118,.6);animation:live 1.6s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(0,230,118,.55)}70%{box-shadow:0 0 0 8px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}
  .pill i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:live 1.8s infinite}
  .lbl{font:700 11px/1 var(--mono);color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:6px}
  .addr{font-size:16px;font-weight:700;line-height:1.5;margin:6px 0}
  .btn{min-height:54px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;padding:0 18px;text-decoration:none;width:100%}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,#00E676,#00B25A);border-color:transparent;color:#04140B}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB);border-color:transparent;color:#fff}
  .btn.gold{background:linear-gradient(135deg,#F59E0B,#D97706);border-color:transparent;color:#000}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626);border-color:transparent;color:#fff}
  .btn.nav{background:linear-gradient(135deg,#8B5CF6,#7C3AED);border-color:transparent;color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gps-info{margin-top:10px;padding:12px;border-radius:12px;background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.25);font-size:12px;color:var(--mut)}
  .gps-info b{color:var(--txt);display:block;font-size:13px;margin-bottom:4px}
  .gps-info.error{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.25);color:#FCA5A5}
  .state{text-align:center;padding:34px 12px}
  .state .big{font-size:46px;margin-bottom:12px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:120;background:rgba(0,230,118,.95);color:#04140B;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #toast.err{background:rgba(239,68,68,.95);color:#fff}
  .login-wrap{max-width:420px;margin:0 auto;padding:0 14px}
  .login-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:28px;margin-top:20px}
  .login-card h2{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center}
  .login-card label{display:block;font:700 11px/1 var(--mono);color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin:14px 0 6px}
  .login-card input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:15px;outline:none}
  .login-card input:focus{border-color:var(--green)}
  .entrega-item{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .entrega-item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .logo-grande{width:100px;height:100px;margin:0 auto 18px}
  .logo-titulo{display:flex;align-items:center;gap:10px}
  .logo-titulo svg{width:32px;height:32px}
  .logo-titulo b{font-size:15px}
  .logo-titulo b span{color:var(--green)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99990;padding:20px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:400px}
  .modal h3{margin:0 0 16px;font-size:18px;color:var(--blue)}
  .modal .btn{margin-bottom:10px}
</style>
</head>
<body>

<svg id="logo-svg" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00B25A"/></linearGradient></defs>
  <rect width="100" height="100" rx="22" fill="url(#lg)"/>
  <path d="M20 62 L32 62 L40 44 L60 44 L68 62 L82 62" stroke="#070B0F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="67" r="8" fill="#070B0F"/>
  <circle cx="67" cy="67" r="8" fill="#070B0F"/>
  <rect x="45" y="32" width="10" height="12" rx="3" fill="#070B0F"/>
  <circle cx="50" cy="38" r="2" fill="#00E676"/>
</svg>

<div class="topbar" id="topbar" style="display:none">
  <div class="brand">
    <div class="logo-titulo">
      <svg viewBox="0 0 100 100"><use href="#logo-svg"/></svg>
      <b>OS-PREMIUM <span>Entregador</span></b>
    </div>
  </div>
  <div class="gps-status off" id="gpsBadge">
    <i></i>
    <span id="gpsTxt">GPS OFF</span>
  </div>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
  const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
  const SESSION_KEY = 'os_entregador_sessao';

  let sessao = null;
  let entregas = [];
  let watchId = null;
  let posicaoAtual = null;
  let gpsAtivo = false;

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width:100%;height:100%"><defs><linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00B25A"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg2)"/><path d="M20 62 L32 62 L40 44 L60 44 L68 62 L82 62" stroke="#070B0F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="67" r="8" fill="#070B0F"/><circle cx="67" cy="67" r="8" fill="#070B0F"/><rect x="45" y="32" width="10" height="12" rx="3" fill="#070B0F"/><circle cx="50" cy="38" r="2" fill="#00E676"/></svg>`;

  function hashSenha(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(36); }
  const toast = (msg, err) => { const t=document.getElementById('toast'); t.textContent=msg; t.className=err?'show err':'show'; setTimeout(()=>t.className='',3000); };
  const STATUS = {
    aguardando: { txt:'⏳ Aguardando você aceitar', cor:'#FACC15', bg:'rgba(250,204,21,.14)' },
    aceita:     { txt:'👍 Aceita — GPS ativo', cor:'#3B82F6', bg:'rgba(59,130,246,.14)' },
    em_rota:    { txt:'🛵 Em rota — GPS transmitindo', cor:'#00E676', bg:'rgba(0,230,118,.14)' },
    entregue:   { txt:'✅ Entrega concluída', cor:'#9CA3AF', bg:'rgba(156,163,175,.14)' },
    cancelada:  { txt:'❌ Cancelada pela loja', cor:'#EF4444', bg:'rgba(239,68,68,.14)' },
  };

  async function api(path, method, body){
    const opts = { method, headers:{'Content-Type':'application/json'} };
    if(body) opts.body = JSON.stringify(body);
    return await fetch(FB + path, opts);
  }

  async function tentarLogin(login, senha){
    const r = await api('/entregadores.json','GET');
    const dados = await r.json();
    if(!dados) return { ok:false, erro:'Nenhum entregador cadastrado.' };
    const lista = Object.entries(dados).map(([id,v])=>({id,...v}));
    const ent = lista.find(e => e.login && e.login.toLowerCase() === login.toLowerCase());
    if(!ent) return { ok:false, erro:'Login não encontrado.' };
    if(!ent.ativo) return { ok:false, erro:'Sua conta está desativada.' };
    if(ent.senhaHash !== hashSenha(senha)) return { ok:false, erro:'Senha incorreta.' };
    return { ok:true, ent };
  }

  function salvarSessao(ent){ sessao={id:ent.id,nome:ent.nome,login:ent.login}; localStorage.setItem(SESSION_KEY,JSON.stringify(sessao)); }
  function carregarSessao(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;} }
  function limparSessao(){ sessao=null; localStorage.removeItem(SESSION_KEY); pararGPS(); }

  async function carregarEntregas(){
    if(!sessao) return;
    try{
      const r = await api('/entregas.json','GET');
      const dados = await r.json();
      if(!dados){ if(entregas.length>0){entregas=[];renderLista();} return; }
      const lista = Object.entries(dados).map(([token,v])=>({token,...v}));
      const novas = lista.filter(e => e.entregadorId===sessao.id && !['entregue','cancelada'].includes(e.status));
      if(JSON.stringify(novas.map(e=>e.token))!==JSON.stringify(entregas.map(e=>e.token))){ entregas=novas; renderLista(); }
      else atualizarStatusCards();
    }catch(e){}
  }

  function renderLogin(erro){
    document.getElementById('topbar').style.display='none';
    document.getElementById('app').innerHTML=`
      <div class="login-wrap">
        <div class="login-card">
          <div class="logo-grande">${LOGO_SVG}</div>
          <h2>OS-PREMIUM <span style="color:var(--green)">Entregador</span></h2>
          <p style="text-align:center;color:var(--mut);font-size:13px;margin-bottom:22px">Entre com seu login e senha</p>
          <label>Login</label>
          <input id="inpLogin" type="text" placeholder="ex: adriana" />
          <label>Senha</label>
          <input id="inpSenha" type="password" placeholder="••••" />
          ${erro?'<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:10px;font-size:12px;color:#FCA5A5;text-align:center">'+esc(erro)+'</div>':''}
          <button class="btn primary" id="btnEntrar" style="margin-top:22px"> Entrar</button>
        </div>
      </div>`;
    document.getElementById('btnEntrar').onclick=async()=>{
      const login=document.getElementById('inpLogin').value.trim();
      const senha=document.getElementById('inpSenha').value;
      if(!login||!senha){toast('Preencha login e senha',true);return;}
      const res=await tentarLogin(login,senha);
      if(res.ok){ salvarSessao(res.ent); toast('✅ Bem-vindo, '+res.ent.nome+'!'); renderApp(); carregarEntregas(); setInterval(carregarEntregas,10000); }
      else renderLogin(res.erro);
    };
    document.getElementById('inpSenha').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('btnEntrar').click();});
  }

  function renderApp(){ document.getElementById('topbar').style.display='flex'; renderLista(); }

  function renderLista(){
    const app=document.getElementById('app');
    if(entregas.length===0){
      app.innerHTML=`<div class="wrap"><div class="card"><div class="state"><div class="logo-grande" style="width:80px;height:80px;margin:0 auto 14px">${LOGO_SVG}</div><b>Olá, ${esc(sessao.nome)}!</b><p style="margin-top:8px;color:var(--mut)">Você não tem entregas ativas no momento.</p></div></div><button class="btn red" id="btnSair">🚪 Sair da conta</button></div>`;
    } else {
      app.innerHTML=`<div class="wrap" id="listaEntregas"></div><button class="btn red" id="btnSair" style="max-width:560px;margin:0 auto">🚪 Sair da conta</button>`;
      const lista=document.getElementById('listaEntregas');
      entregas.forEach(e=>lista.appendChild(criarCardEntrega(e)));
    }
    document.getElementById('btnSair').onclick=()=>{if(confirm('Deseja sair?')){limparSessao();renderLogin();}};
  }

  function atualizarStatusCards(){
    entregas.forEach(e=>{
      const pill=document.getElementById('pill-'+e.token);
      if(pill){const st=STATUS[e.status]||STATUS.aguardando;pill.style.color=st.cor;pill.style.background=st.bg;pill.innerHTML=`<i></i>${st.txt}`;}
      const btnAcao=document.getElementById('btn-acao-'+e.token);
      if(btnAcao){
        const novo=btnAcao.cloneNode(true); btnAcao.parentNode.replaceChild(novo,btnAcao);
        if(e.status==='aguardando'){novo.className='btn primary';novo.innerHTML='✅ Aceitar entrega';novo.onclick=()=>executarAcao(e,'aceitar');}
        else if(e.status==='aceita'){novo.className='btn blue';novo.innerHTML='🛵 Iniciar rota';novo.onclick=()=>executarAcao(e,'rota');}
        else if(e.status==='em_rota'){novo.className='btn gold';novo.innerHTML='📦 Confirmar entrega';novo.onclick=()=>executarAcao(e,'entregar');}
      }
      // Atualiza info do GPS
      const gpsInfo=document.getElementById('gps-info-'+e.token);
      if(gpsInfo){
        if(gpsAtivo && posicaoAtual){
          gpsInfo.className='gps-info';
          gpsInfo.innerHTML=`<b>🛰️ GPS ativo</b>Transmitindo posição: ${posicaoAtual.lat.toFixed(5)}, ${posicaoAtual.lng.toFixed(5)}`;
        } else {
          gpsInfo.className='gps-info error';
          gpsInfo.innerHTML=`<b>⚠️ GPS inativo</b>Aguardando ativação...`;
        }
      }
    });
  }

  function criarCardEntrega(e){
    const st=STATUS[e.status]||STATUS.aguardando;
    const tel=String(e.telefone||'').replace(/\D/g,'');
    const div=document.createElement('div');
    div.className='entrega-item'; div.dataset.token=e.token; div.id='card-'+e.token;
    let acaoHtml='';
    if(e.status==='aguardando')acaoHtml='<button class="btn primary" id="btn-acao-'+e.token+'">✅ Aceitar entrega</button>';
    else if(e.status==='aceita')acaoHtml='<button class="btn blue" id="btn-acao-'+e.token+'"> Iniciar rota</button>';
    else if(e.status==='em_rota')acaoHtml='<button class="btn gold" id="btn-acao-'+e.token+'">📦 Confirmar entrega</button>';
    const itensHtml=Array.isArray(e.itens)&&e.itens.length>0?'<div class="lbl" style="margin-top:10px">📦 O que levar ('+e.itens.length+' itens)</div><div style="margin-top:6px">'+e.itens.map(it=>'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px"><span>'+(it.tipo==='servico'?' ':'📦 ')+esc(it.nome)+'</span><span style="color:var(--green);font-weight:700">x'+it.quantidade+'</span></div>').join('')+'</div>':'';
    div.innerHTML=`
      <div class="head">
        <span class="pill" id="pill-${e.token}" style="color:${st.cor};background:${st.bg}"><i></i>${st.txt}</span>
        <span style="font:800 18px/1 var(--mono)">OS #${esc(e.numero)}</span>
      </div>
      <div class="lbl">Cliente</div>
      <div class="addr">👤 ${esc(e.cliente)||'—'}</div>
      ${e.endereco?'<div class="lbl" style="margin-top:10px">Endereço de entrega</div><div class="addr">📍 '+esc(e.endereco)+'</div>':'<p style="margin-top:8px;font-size:12px;color:var(--mut)">Sem endereço — combine por telefone.</p>'}
      ${itensHtml}
      ${e.observacoes?'<div style="margin-top:10px;padding:12px;background:rgba(245,158,11,.08);border:1px dashed rgba(245,158,11,.35);border-radius:12px;font-size:13px;color:#EBD9B4">📝 '+esc(e.observacoes)+'</div>':''}
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px"><span style="color:var(--mut)">Valor a receber</span><span style="font-weight:600;color:var(--green)">R$ ${(parseFloat(e.valor)||0).toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;font-size:14px"><span style="color:var(--mut)">Telefone</span><span style="font-weight:600">${esc(e.telefone)||'—'}</span></div>
      </div>
      <div class="gps-info" id="gps-info-${e.token}">
        <b>⚠️ GPS inativo</b>Aguardando ativação...
      </div>
      <div style="margin-top:14px;display:grid;gap:10px">
        ${tel?'<div class="grid2"><a class="btn" href="tel:'+tel+'" style="min-height:44px;font-size:13px">📞 Ligar</a><button class="btn nav" id="btn-navegar-'+e.token+'" style="min-height:44px;font-size:13px">️ Navegar</button></div>':'<button class="btn nav" id="btn-navegar-'+e.token+'">🗺️ Navegar</button>'}
        ${acaoHtml}
      </div>`;
    const btnNavegar=div.querySelector('#btn-navegar-'+e.token);
    if(btnNavegar)btnNavegar.onclick=()=>abrirModalNavegacao(e);
    return div;
  }

  function abrirModalNavegacao(e){
    if(!e.endereco){toast('❌ Sem endereço para navegar',true);return;}
    const enderecoEncoded=encodeURIComponent(e.endereco);
    const app=document.getElementById('app');
    const modal=document.createElement('div');
    modal.className='modal-overlay';
    modal.innerHTML=`
      <div class="modal">
        <h3>🗺️ Escolha o app de navegação</h3>
        <p style="margin-bottom:16px;color:var(--mut);font-size:13px">${esc(e.endereco)}</p>
        <button class="btn" id="btnWaze" style="background:#33CCFF;color:#000;font-weight:800">🚗 Waze</button>
        <button class="btn" id="btnGoogle" style="background:#4285F4;color:#fff;font-weight:800">🗺️ Google Maps</button>
        <button class="btn" id="btnFechar" style="margin-top:10px">Cancelar</button>
      </div>`;
    app.appendChild(modal);
    document.getElementById('btnWaze').onclick=()=>{window.open('https://waze.com/ul?q='+enderecoEncoded+'&navigate=yes','_blank');modal.remove();};
    document.getElementById('btnGoogle').onclick=()=>{window.open('https://www.google.com/maps/search/?api=1&query='+enderecoEncoded,'_blank');modal.remove();};
    document.getElementById('btnFechar').onclick=()=>modal.remove();
    modal.onclick=(ev)=>{if(ev.target===modal)modal.remove();};
  }

  async function executarAcao(e,acao){
    console.log('👉 Ação:',acao,'Token:',e.token);
    if(acao==='aceitar'){
      toast('✅ Entrega aceita! Ativando GPS...');
      await ativarGPS();
      await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{status:'aceita',aceitaEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    } else if(acao==='rota'){
      if(!gpsAtivo||!posicaoAtual){toast('⚠️ GPS ainda não ativou. Aguarde...',true);return;}
      toast('🛵 Rota iniciada!');
      await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{status:'em_rota',rotaIniciadaEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    } else if(acao==='entregar'){
      if(!confirm('Confirmar entrega?'))return;
      pararGPS();
      toast('📦 Entrega confirmada!');
      await api('/entregas/'+encodeURIComponent(e.token)+'.json','PATCH',{status:'entregue',entregueEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    }
    setTimeout(carregarEntregas,1000);
  }

  // ✅ FUNÇÃO PROFISSIONAL DE GPS
  async function ativarGPS(){
    if(gpsAtivo){
      console.log('⚠️ GPS já está ativo');
      return;
    }

    if(!('geolocation' in navigator)){
      toast('❌ Este dispositivo não suporta GPS',true);
      return;
    }

    console.log('📡 Solicitando permissão de localização...');
    toast('⏳ Solicitando acesso ao GPS...');

    // Primeiro, testa com getCurrentPosition para garantir que funciona
    try {
      const posicao = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      });

      console.log('✅ Permissão concedida! Posição inicial:', posicao.coords.latitude, posicao.coords.longitude);
      
      // Agora ativa o watchPosition para monitoramento contínuo
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const {latitude, longitude, accuracy, speed} = pos.coords;
          posicaoAtual = {lat: latitude, lng: longitude};
          gpsAtivo = true;
          
          console.log(' Posição atualizada:', latitude, longitude);
          
          // Atualiza UI
          const badge = document.getElementById('gpsBadge');
          const txt = document.getElementById('gpsTxt');
          if(badge){badge.className='gps-status on';}
          if(txt){txt.textContent='GPS ON';}
          
          // Transmite para o Firebase
          transmitirPosicao(latitude, longitude, accuracy, speed);
          
          // Atualiza cards
          atualizarStatusCards();
        },
        (err) => {
          console.error('❌ Erro GPS:', err);
          let msg = 'Erro no GPS';
          if(err.code===1) msg='Permissão de localização negada. Verifique as configurações do navegador.';
          if(err.code===2) msg='Localização indisponível.';
          if(err.code===3) msg='Tempo esgotado ao buscar localização.';
          toast('❌ '+msg, true);
          gpsAtivo = false;
          const txt = document.getElementById('gpsTxt');
          if(txt) txt.textContent='GPS OFF';
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 3000
        }
      );

      toast('✅ GPS ativado com sucesso!');
      
    } catch (err) {
      console.error('❌ Falha ao ativar GPS:', err);
      toast('❌ Não foi possível ativar o GPS. Verifique as permissões.', true);
    }
  }

  function transmitirPosicao(lat, lng, accuracy, speed){
    if(!posicaoAtual) return;
    
    entregas.forEach(e => {
      if(e.status === 'aceita' || e.status === 'em_rota'){
        api('/posicoes/'+encodeURIComponent(e.token)+'.json','PUT',{
          lat: lat,
          lng: lng,
          precisao: Math.round(accuracy || 0),
          velocidade: Math.round((speed || 0) * 3.6),
          timestamp: new Date().toISOString(),
          entregadorId: sessao.id
        }).catch(err => console.error('Erro ao transmitir posição:', err));
      }
    });
  }

  function pararGPS(){
    if(watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    gpsAtivo = false;
    posicaoAtual = null;
    
    const badge = document.getElementById('gpsBadge');
    const txt = document.getElementById('gpsTxt');
    if(badge) badge.className='gps-status off';
    if(txt) txt.textContent='GPS OFF';
    
    atualizarStatusCards();
  }

  (function init(){
    const s=carregarSessao();
    if(s){sessao=s;renderApp();carregarEntregas();setInterval(carregarEntregas,10000);}
    else renderLogin();
  })();
</script>
