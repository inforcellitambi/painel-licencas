<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#00E676" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Entregador — OS-PREMIUM</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px;-webkit-text-size-adjust:100%}
  body{
    background:#070B0F;
    color:#E6EDF3;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding:0;
    min-height:100vh;
    overflow-x:hidden;
  }
  
  /* Container principal - mobile first */
  .wrap{
    width:100%;
    max-width:100%;
    margin:0 auto;
    padding:70px 12px 20px;
  }
  
  /* Topbar fixa */
  .topbar{
    position:fixed;
    top:0;left:0;right:0;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    background:rgba(7,11,15,.98);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.07);
    z-index:50;
  }
  .brand b{font-size:13px;font-weight:800}
  .brand span{color:#00E676}
  .gps{
    font-size:9px;
    font-weight:800;
    padding:5px 10px;
    border-radius:999px;
    background:rgba(239,68,68,.1);
    color:#EF4444;
    border:1px solid rgba(239,68,68,.3);
    white-space:nowrap;
  }
  .gps.on{
    background:rgba(0,230,118,.1);
    color:#00E676;
    border-color:rgba(0,230,118,.3);
  }
  
  /* Cards */
  .card{
    background:#0F1720;
    border:1px solid rgba(255,255,255,.07);
    border-radius:16px;
    padding:14px;
    margin-bottom:10px;
    width:100%;
  }
  
  /* Pills de status */
  .pill{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    margin-bottom:8px;
    white-space:nowrap;
  }
  
  /* Labels */
  .lbl{
    font-size:10px;
    color:#8B98A5;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin:8px 0 4px;
    font-weight:700;
  }
  
  /* Endereços e nomes */
  .addr{
    font-size:14px;
    font-weight:700;
    line-height:1.4;
    word-wrap:break-word;
    overflow-wrap:break-word;
  }
  
  /* Número da OS */
  .os-num{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
    word-break:break-all;
  }
  
  /* Botões */
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:48px;
    padding:0 12px;
    border-radius:12px;
    border:none;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    width:100%;
    margin-bottom:8px;
    color:#fff;
    font-family:inherit;
    text-decoration:none;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.98)}
  .btn.green{background:linear-gradient(135deg,#00E676,#00B25A);color:#000}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB)}
  .btn.gold{background:linear-gradient(135deg,#F59E0B,#D97706);color:#000}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626)}
  .btn.purple{background:linear-gradient(135deg,#A855F7,#7C3AED)}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:#E6EDF3}
  
  /* Grid de botões */
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .grid2 .btn{margin-bottom:0}
  
  /* Lista de itens */
  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:6px 0;
    font-size:12px;
    border-bottom:1px dashed rgba(255,255,255,.05);
  }
  .item-row:last-child{border-bottom:none}
  .item-row .nome{
    flex:1;
    word-wrap:break-word;
    overflow-wrap:break-word;
  }
  .item-row .qtd{
    color:#00E676;
    font-weight:700;
    white-space:nowrap;
  }
  
  /* Linha de valor */
  .valor-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    font-size:13px;
  }
  .valor-row .label{color:#8B98A5}
  .valor-row .valor{color:#00E676;font-weight:700}
  
  /* Status do GPS */
  .gps-status{
    margin-top:8px;
    padding:8px;
    background:rgba(59,130,246,.1);
    border:1px solid rgba(59,130,246,.3);
    border-radius:8px;
    font-size:11px;
    color:#3B82F6;
    text-align:center;
    word-wrap:break-word;
  }
  .gps-status.on{
    background:rgba(0,230,118,.1);
    border-color:rgba(0,230,118,.3);
    color:#00E676;
  }
  
  /* Observações */
  .obs{
    margin-top:8px;
    padding:8px;
    background:rgba(245,158,11,.08);
    border-radius:8px;
    font-size:12px;
    color:#EBD9B4;
    word-wrap:break-word;
  }
  
  /* Login */
  .login{
    max-width:100%;
    width:100%;
    margin:60px auto 0;
    padding:0 12px;
  }
  .login-card{
    background:#0F1720;
    border:1px solid rgba(255,255,255,.07);
    border-radius:16px;
    padding:20px;
  }
  .login h2{
    text-align:center;
    font-size:20px;
    margin-bottom:16px;
  }
  .login label{
    display:block;
    font-size:10px;
    color:#8B98A5;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin:12px 0 4px;
    font-weight:700;
  }
  .login input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.04);
    color:#E6EDF3;
    font-size:16px; /* Evita zoom no iOS */
    outline:none;
    font-family:inherit;
  }
  .login input:focus{border-color:#00E676}
  
  /* Estado vazio */
  .state{
    text-align:center;
    padding:30px 12px;
  }
  .state .big{font-size:40px;margin-bottom:10px}
  .state b{font-size:16px}
  .state p{margin-top:6px;font-size:13px;color:#8B98A5}
  
  /* Toast */
  #toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#00E676;
    color:#000;
    font-weight:800;
    font-size:12px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    transition:opacity .3s;
    z-index:999;
    max-width:90vw;
    text-align:center;
    pointer-events:none;
  }
  #toast.show{opacity:1}
  #toast.err{background:#EF4444;color:#fff}
  
  /* Modal de navegação */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99990;
    padding:16px;
  }
  .modal{
    background:#0F1720;
    border:1px solid rgba(255,255,255,.07);
    border-radius:16px;
    padding:20px;
    width:100%;
    max-width:360px;
  }
  .modal h3{
    margin:0 0 12px;
    font-size:16px;
    color:#3B82F6;
  }
  .modal p{
    margin-bottom:12px;
    color:#8B98A5;
    font-size:12px;
    word-wrap:break-word;
  }
  
  /* Media queries para telas maiores */
  @media (min-width:480px){
    .wrap{max-width:480px;padding:70px 16px 20px}
    .card{padding:16px}
    .addr{font-size:15px}
    .btn{font-size:14px;min-height:50px}
  }
  @media (min-width:768px){
    .wrap{max-width:560px}
  }
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
  <div class="brand"><b>OS-PREMIUM <span>Entregador</span></b></div>
  <div class="gps" id="gpsBadge">GPS OFF</div>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
const KEY = 'os_entregador_sessao';

let sessao = null;
let entregas = [];
let watchId = null;
let posicaoAtual = null;

const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return'h'+h.toString(36);}

const toast = (msg,err) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  setTimeout(() => t.className = '', 3000);
};

async function api(path, method, body){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  return await fetch(FB + path, opts);
}

async function login(user, pass){
  const r = await api('/entregadores.json','GET');
  const d = await r.json();
  if(!d) return {ok:false, erro:'Nenhum entregador.'};
  const lista = Object.entries(d).map(([id,v])=>({id,...v}));
  const ent = lista.find(e => e.login && e.login.toLowerCase() === user.toLowerCase());
  if(!ent) return {ok:false, erro:'Login não encontrado.'};
  if(!ent.ativo) return {ok:false, erro:'Conta desativada.'};
  if(ent.senhaHash !== hash(pass)) return {ok:false, erro:'Senha incorreta.'};
  return {ok:true, ent};
}

function salvarSessao(ent){
  sessao = {id:ent.id, nome:ent.nome};
  localStorage.setItem(KEY, JSON.stringify(sessao));
}

function carregarSessao(){
  try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}
}

async function carregarEntregas(){
  if(!sessao) return;
  const r = await api('/entregas.json','GET');
  const d = await r.json();
  if(!d){entregas=[];render();return;}
  const lista = Object.entries(d).map(([token,v])=>({token,...v}));
  entregas = lista.filter(e => 
    e.entregadorId === sessao.id && 
    !['entregue','cancelada','recusada'].includes(e.status)
  );
  render();
}

function renderLogin(erro){
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="login">
      <div class="login-card">
        <h2>OS-PREMIUM <span style="color:#00E676">Entregador</span></h2>
        <label>Login</label>
        <input id="inpUser" type="text" placeholder="ex: adriana" />
        <label>Senha</label>
        <input id="inpPass" type="password" placeholder="••••" />
        ${erro ? '<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.12);border-radius:10px;font-size:12px;color:#FCA5A5;text-align:center">'+esc(erro)+'</div>' : ''}
        <button class="btn green" id="btnEntrar" style="margin-top:20px">🔐 Entrar</button>
      </div>
    </div>
  `;
  document.getElementById('btnEntrar').onclick = async () => {
    const user = document.getElementById('inpUser').value.trim();
    const pass = document.getElementById('inpPass').value;
    if(!user || !pass){toast('Preencha tudo',true);return;}
    const res = await login(user, pass);
    if(res.ok){
      salvarSessao(res.ent);
      toast('✅ Bem-vindo, '+res.ent.nome);
      document.getElementById('topbar').style.display = 'flex';
      carregarEntregas();
      setInterval(carregarEntregas, 10000);
    } else {
      renderLogin(res.erro);
    }
  };
}

function render(){
  const app = document.getElementById('app');
  
  if(!sessao){
    renderLogin();
    return;
  }
  
  let html = '<div class="wrap">';
  
  if(entregas.length === 0){
    html += '<div class="card"><div class="state"><div class="big">📭</div><b>Olá, '+esc(sessao.nome)+'!</b><p>Nenhuma entrega ativa no momento.</p></div></div>';
  } else {
    entregas.forEach(e => {
      const statusColors = {
        aguardando: {txt:'⏳ Aguardando', cor:'#FACC15', bg:'rgba(250,204,21,.14)'},
        aceita: {txt:'👍 Aceita', cor:'#3B82F6', bg:'rgba(59,130,246,.14)'},
        em_rota: {txt:'🛵 Em rota', cor:'#00E676', bg:'rgba(0,230,118,.14)'}
      };
      const st = statusColors[e.status] || statusColors.aguardando;
      
      let botoes = '';
      if(e.status === 'aguardando'){
        botoes = `
          <button class="btn green" onclick="aceitar('${e.token}')">✅ Aceitar entrega</button>
          <button class="btn red" onclick="recusar('${e.token}')">🚫 Recusar</button>
        `;
      } else if(e.status === 'aceita'){
        botoes = `<button class="btn blue" onclick="iniciarRota('${e.token}')">🛵 Iniciar rota (ativa GPS)</button>`;
      } else if(e.status === 'em_rota'){
        botoes = `<button class="btn gold" onclick="confirmar('${e.token}')">📦 Confirmar entrega</button>`;
      }
      
      const itens = Array.isArray(e.itens) && e.itens.length > 0
        ? '<div class="lbl">📦 Itens ('+e.itens.length+')</div>' + e.itens.map(it=>'<div class="item-row"><span class="nome">'+(it.tipo==='servico'?'🔧 ':'📦 ')+esc(it.nome)+'</span><span class="qtd">x'+it.quantidade+'</span></div>').join('')
        : '';
      
      html += `
        <div class="card">
          <div class="pill" style="color:${st.cor};background:${st.bg}">${st.txt}</div>
          <div class="os-num">OS #${esc(e.numero)}</div>
          <div class="lbl">Cliente</div>
          <div class="addr">👤 ${esc(e.cliente)}</div>
          ${e.endereco ? '<div class="lbl">Endereço</div><div class="addr">📍 '+esc(e.endereco)+'</div>' : ''}
          ${itens}
          ${e.observacoes ? '<div class="obs">📝 '+esc(e.observacoes)+'</div>' : ''}
          <div class="valor-row">
            <span class="label">Valor a receber</span>
            <span class="valor">R$ ${(parseFloat(e.valor)||0).toFixed(2)}</span>
          </div>
          <div style="margin-top:10px">${botoes}`;
      
      if(e.endereco){
        const tel = String(e.telefone||'').replace(/\D/g,'');
        const encoded = encodeURIComponent(e.endereco);
        html += '<div class="grid2">';
        if(tel) html += '<a class="btn ghost" href="tel:'+tel+'">📞 Ligar</a>';
        html += '<button class="btn purple" onclick="navegar(\''+encoded+'\')">🗺️ Navegar</button>';
        html += '</div>';
      }
      
      if(posicaoAtual){
        html += '<div class="gps-status on">🛰️ GPS ATIVO: '+posicaoAtual.lat.toFixed(5)+', '+posicaoAtual.lng.toFixed(5)+'</div>';
      } else {
        html += '<div class="gps-status">⚠️ GPS inativo - Clique em "Iniciar rota"</div>';
      }
      
      html += '</div></div>';
    });
  }
  
  html += '<button class="btn red" onclick="sair()" style="margin-top:12px">🚪 Sair</button>';
  html += '</div>';
  
  app.innerHTML = html;
}

window.aceitar = async (token) => {
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'aceita',aceitaEm:new Date().toISOString()});
  toast('✅ Entrega aceita! Clique em "Iniciar rota".');
  setTimeout(carregarEntregas, 500);
};

window.recusar = async (token) => {
  if(!confirm('Recusar esta entrega?')) return;
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'recusada',recusadaEm:new Date().toISOString()});
  toast('🚫 Entrega recusada');
  setTimeout(carregarEntregas, 500);
};

window.iniciarRota = async (token) => {
  toast('⏳ Ativando GPS...');
  const gpsOk = await ativarGPS();
  if(!gpsOk){
    toast('❌ GPS não ativou. Verifique as permissões.', true);
    return;
  }
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'em_rota',rotaIniciadaEm:new Date().toISOString()});
  toast('🛵 Rota iniciada! GPS ativo.');
  setTimeout(carregarEntregas, 500);
};

window.confirmar = async (token) => {
  if(!confirm('Confirmar entrega?')) return;
  await api('/entregas/'+encodeURIComponent(token)+'.json','PATCH',{status:'entregue',entregueEm:new Date().toISOString()});
  if(watchId){navigator.geolocation.clearWatch(watchId);watchId=null;}
  posicaoAtual = null;
  const badge = document.getElementById('gpsBadge');
  if(badge){badge.className='gps';badge.textContent='GPS OFF';}
  toast('📦 Entrega confirmada!');
  setTimeout(carregarEntregas, 500);
};

window.navegar = (endereco) => {
  const apps = [
    {name:'🚗 Waze', url:'https://waze.com/ul?q='+endereco+'&navigate=yes', color:'#33CCFF', txtColor:'#000'},
    {name:'🗺️ Google Maps', url:'https://www.google.com/maps/search/?api=1&query='+endereco, color:'#4285F4', txtColor:'#fff'}
  ];
  const app = document.getElementById('app');
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = '<div class="modal"><h3>🗺️ Escolha o app</h3><p>'+esc(decodeURIComponent(endereco))+'</p>' + 
    apps.map(a => '<button class="btn" style="background:'+a.color+';color:'+a.txtColor+'" onclick="window.open(\''+a.url+'\',\'_blank\');this.closest(\'.modal-overlay\').remove()">'+a.name+'</button>').join('') +
    '<button class="btn ghost" onclick="this.closest(\'.modal-overlay\').remove()">Cancelar</button></div>';
  app.appendChild(modal);
  modal.onclick = (e) => {if(e.target===modal)modal.remove();};
};

window.sair = () => {
  if(confirm('Sair da conta?')){
    sessao = null;
    localStorage.removeItem(KEY);
    if(watchId){navigator.geolocation.clearWatch(watchId);watchId=null;}
    posicaoAtual = null;
    renderLogin();
  }
};

async function ativarGPS(){
  if(!('geolocation' in navigator)){
    console.error('Navegador não suporta geolocation');
    return false;
  }
  
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        posicaoAtual = {lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy};
        console.log('GPS ativado:', posicaoAtual);
        
        const badge = document.getElementById('gpsBadge');
        if(badge){badge.className='gps on';badge.textContent='GPS ON';}
        
        if(watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(
          (p) => {
            posicaoAtual = {lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy};
            transmitirPosicao(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.coords.speed);
          },
          (err) => console.error('Erro watchPosition:', err),
          {enableHighAccuracy:true, timeout:15000, maximumAge:3000}
        );
        
        resolve(true);
      },
      (err) => {
        console.error('Erro getCurrentPosition:', err);
        let msg = 'Erro no GPS';
        if(err.code===1) msg='Permissão negada';
        if(err.code===2) msg='Localização indisponível';
        if(err.code===3) msg='Timeout';
        toast('❌ '+msg, true);
        resolve(false);
      },
      {enableHighAccuracy:true, timeout:20000, maximumAge:0}
    );
  });
}

function transmitirPosicao(lat, lng, acc, speed){
  entregas.forEach(e => {
    if(e.status === 'aceita' || e.status === 'em_rota'){
      api('/posicoes/'+encodeURIComponent(e.token)+'.json','PUT',{
        lat, lng, precisao:Math.round(acc||0), velocidade:Math.round((speed||0)*3.6),
        timestamp:new Date().toISOString(), entregadorId:sessao.id
      }).catch(err => console.error('Erro ao transmitir:', err));
    }
  });
}

// INIT
const s = carregarSessao();
if(s){
  sessao = s;
  document.getElementById('topbar').style.display = 'flex';
  carregarEntregas();
  setInterval(carregarEntregas, 10000);
} else {
  renderLogin();
}
</script>
</body>
</html>
