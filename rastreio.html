<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acompanhar OS — OS-PREMIUM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter','Segoe UI',Arial,sans-serif;
    background: radial-gradient(ellipse at top,#0F2420 0%,#0A0F14 60%,#070A0D 100%);
    color:#E5E7EB; min-height:100vh; padding:16px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  .card { background:#111E28; border:1px solid #1F2D3A; border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .logo { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#00E676,#00C853); display:flex; align-items:center; justify-content:center; color:#000; font-weight:900; font-size:18px; }
  .brand b { font-size:15px; } .brand b span { color:#00E676; }
  .osnum { font-family:monospace; font-size:24px; font-weight:800; color:#00E676; }
  .status { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; font-weight:800; font-size:13px; margin-top:8px; }
  .sec { font-size:11px; color:#9CA3AF; text-transform:uppercase; letter-spacing:.6px; font-weight:700; margin:0 0 8px 0; display:flex; align-items:center; gap:6px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed #1F2D3A; font-size:14px; }
  .row:last-child { border-bottom:none; }
  .row .k { color:#9CA3AF; } .row .v { font-weight:600; text-align:right; }
  .txt { font-size:14px; line-height:1.6; color:#E5E7EB; white-space:pre-wrap; }
  .grid-fotos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .grid-fotos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:1px solid #1F2D3A; cursor:pointer; }
  .chk { display:flex; justify-content:space-between; font-size:13px; padding:5px 8px; border-radius:6px; margin-bottom:4px; }
  .chk.ok { background:rgba(0,230,118,.08); } .chk.no { background:rgba(239,68,68,.08); }
  .timeline { border-left:2px solid #1F2D3A; padding-left:16px; display:flex; flex-direction:column; gap:12px; }
  .step { position:relative; } .step::before { content:''; position:absolute; left:-23px; top:4px; width:11px; height:11px; border-radius:50%; background:#1F2D3A; }
  .step.on::before { background:#00E676; box-shadow:0 0 10px rgba(0,230,118,.6); }
  .step .s { font-size:14px; font-weight:700; } .step .d { font-size:11px; color:#9CA3AF; }
  .foot { text-align:center; font-size:11px; color:#6B7280; padding:8px 0 20px 0; }
  .err { text-align:center; color:#9CA3AF; padding:40px 0; font-size:15px; }
  .exp { text-align:center; padding:30px 10px; }
  .exp .big { font-size:44px; margin-bottom:10px; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.95); display:none; align-items:center; justify-content:center; z-index:99; }
  #lightbox img { max-width:94vw; max-height:94vh; border-radius:10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand"><div class="logo">🔧</div><b>OS-<span>PREMIUM</span></b></div>
      <div id="content"><p class="err">Carregando...</p></div>
    </div>
    <div class="foot">OS-PREMIUM • Acompanhamento em tempo real</div>
  </div>
  <div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src="" alt="" /></div>

<script>
  const FB = 'https://os-premium-killswitch-default-rtdb.firebaseio.com';
  const token = new URLSearchParams(location.search).get('t');
  const el = document.getElementById('content');

  const cores = {
    'Em Reparo':['#FACC15','rgba(250,204,21,.15)'], 'Aguardando Peça':['#3B82F6','rgba(59,130,246,.15)'],
    'Pronto':['#00E676','rgba(0,230,118,.15)'], 'Entregue':['#9CA3AF','rgba(156,163,175,.15)'],
    'Aguardando Técnico':['#F59E0B','rgba(245,158,11,.15)'], 'Em Execução':['#3B82F6','rgba(59,130,246,.15)'],
    'Laudo Criado':['#A855F7','rgba(168,85,247,.15)'], 'Finalizado':['#00E676','rgba(0,230,118,.15)'],
    'Pronto p/ Fechamento':['#00E676','rgba(0,230,118,.15)'],
  };
  const moeda = v => parseFloat(v||0).toFixed(2).replace('.',',');
  const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function abrirFoto(src){ const lb=document.getElementById('lightbox'); document.getElementById('lightboxImg').src=src; lb.style.display='flex'; }

  async function carregar(){
    if(!token){ el.innerHTML='<p class="err">Link inválido.</p>'; return; }
    try{
      const r = await fetch(`${FB}/os_public/${encodeURIComponent(token)}.json`);
      const os = await r.json();
      if(!os){ el.innerHTML='<p class="err">OS não encontrada.</p>'; return; }

      if(os.expiraEm && new Date(os.expiraEm).getTime() < Date.now()){
        el.innerHTML = `<div class="exp"><div class="big">⏳</div><b>Link expirado</b><p style="margin-top:8px;color:#9CA3AF;font-size:13px">Este link de acompanhamento expirou (validade de 90 dias).<br>Fale com a loja para mais informações.</p></div>`;
        return;
      }

      const [cor,bg] = cores[os.status] || ['#9CA3AF','rgba(156,163,175,.15)'];
      const fotos = Array.isArray(os.fotos)?os.fotos:[];
      const pecas = Array.isArray(os.pecas)?os.pecas:[];
      const chk = os.checklist && typeof os.checklist==='object' ? Object.entries(os.checklist) : [];
      const hist = (os.historico||[]).map((h,i,arr)=>`<div class="step ${i===arr.length-1?'on':''}"><div class="s">${esc(h.status)}</div><div class="d">${esc(h.data)}</div></div>`).join('');

      el.innerHTML = `
        <div class="osnum">OS #${esc(os.numero)}</div>
        <span class="status" style="color:${cor};background:${bg}">● ${esc(os.status)}</span>

        <div class="card" style="margin-top:14px">
          <p class="sec">👤 Cliente</p>
          <div class="row"><span class="k">Nome</span><span class="v">${esc(os.cliente)||'—'}</span></div>
          <div class="row"><span class="k">Telefone</span><span class="v">${esc(os.telefone)||'—'}</span></div>
        </div>

        <div class="card">
          <p class="sec">💻 Equipamento</p>
          <div class="row"><span class="k">Tipo</span><span class="v">${esc(os.equipamento)||'—'}</span></div>
          <div class="row"><span class="k">Marca</span><span class="v">${esc(os.marca)||'—'}</span></div>
          <div class="row"><span class="k">Modelo</span><span class="v">${esc(os.modelo)||'—'}</span></div>
          <div class="row"><span class="k">Nº Série / IMEI</span><span class="v">${esc(os.numeroSerie)||'—'}</span></div>
        </div>

        <div class="card">
          <p class="sec">🔧 Defeito relatado</p>
          <p class="txt">${esc(os.defeito)||'—'}</p>
          ${os.observacoes?`<p class="sec" style="margin-top:12px">📝 Observações</p><p class="txt">${esc(os.observacoes)}</p>`:''}
        </div>

        <div class="card">
          <p class="sec">💰 Valores</p>
          <div class="row"><span class="k">Entrada</span><span class="v">R$ ${moeda(os.valorEntrada)}</span></div>
          <div class="row"><span class="k">Total do serviço</span><span class="v">R$ ${moeda(os.valorOrcamento)}</span></div>
          <div class="row"><span class="k">Restante</span><span class="v" style="color:${(os.valorRestante||0)>0?'#EF4444':'#00E676'}">R$ ${moeda(os.valorRestante)}</span></div>
          <div class="row"><span class="k">Pagamento</span><span class="v">${esc(os.formaPagamento)||'—'} • ${esc(os.statusPagamento)||'—'}</span></div>
        </div>

        ${pecas.length?`<div class="card"><p class="sec">🔩 Peças utilizadas</p>${pecas.map(p=>`<div class="row"><span class="k">${p.quantidade}x ${esc(p.nome)}</span><span class="v">R$ ${moeda((parseFloat(p.preco_unitario||p.valor||p.preco)||0)*(parseInt(p.quantidade)||1))}</span></div>`).join('')}</div>`:''}

        ${chk.length?`<div class="card"><p class="sec">✅ Checklist de entrada</p>${chk.filter(([k])=>k!=='estadoGeral').map(([k,v])=>`<div class="chk ${v?'ok':'no'}"><span>${esc(k)}</span><span>${v?'✔':'—'}</span></div>`).join('')}${os.checklist&&os.checklist.estadoGeral?`<p class="txt" style="margin-top:6px;font-size:12px;color:#9CA3AF">Estado geral: ${esc(os.checklist.estadoGeral)}</p>`:''}</div>`:''}

        ${fotos.length?`<div class="card"><p class="sec">📸 Fotos do aparelho</p><div class="grid-fotos">${fotos.map(f=>`<img src="${f}" onclick="abrirFoto(this.src)" alt="Foto">`).join('')}</div></div>`:''}

        ${os.laudo?`<div class="card"><p class="sec">📄 Laudo técnico</p><p class="txt">${esc(os.laudo)}</p></div>`:''}

        <div class="card">
          <p class="sec">🛠️ Responsável & garantia</p>
          <div class="row"><span class="k">Técnico</span><span class="v">${esc(os.tecnico)||'—'}</span></div>
          <div class="row"><span class="k">Garantia</span><span class="v">${esc(os.garantia)||90} dias</span></div>
        </div>

        <div class="card">
          <p class="sec">🕒 Linha do tempo</p>
          <div class="timeline">${hist}</div>
        </div>

        <div class="foot">Atualizado em ${esc(os.atualizadoEm)} • Link válido até ${os.expiraEm?new Date(os.expiraEm).toLocaleDateString('pt-BR'):''}</div>
      `;
    }catch(e){ el.innerHTML='<p class="err">Erro ao carregar. Tente novamente.</p>'; }
  }
  carregar();
  setInterval(carregar, 15000);
</script>
</body>
</html>
